<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Brain Review — Milez Ahead</title>
<style>
  :root{--navy:#1d2a4d;--teal:#0c8b86;--gold:#c79a3b;--paper:#f6f5f1}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);font:16px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;color:#232733;padding-bottom:60px}
  header{background:var(--navy);color:#fff;padding:18px 16px}
  header .k{color:var(--gold);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700}
  header h1{margin:4px 0 2px;font-size:20px}
  header p{margin:0;font-size:13px;opacity:.85}
  .count{position:sticky;top:0;background:var(--gold);color:#fff;text-align:center;font-weight:700;font-size:13.5px;padding:7px;z-index:5}
  .wrap{max-width:640px;margin:0 auto;padding:14px}
  .card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(20,30,50,.08)}
  .card.rv{opacity:.75}
  .q{background:#e7f6e9;border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:14.5px;margin-bottom:8px;white-space:pre-wrap}
  .a{background:#eef0f6;border-radius:12px 12px 3px 12px;padding:10px 12px;font-size:14.5px;white-space:pre-wrap}
  .meta{margin-top:6px}
  .b{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-radius:99px;padding:2px 9px;color:#fff}
  .b.answer{background:var(--teal)}.b.handoff{background:#b3423a}.b.silent{background:#8a8578}
  .acts{margin-top:10px}
  button{width:100%;border:0;border-radius:11px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
  .ok{background:var(--teal);color:#fff}
  details{margin-top:8px}
  summary{font-size:14px;color:var(--navy);font-weight:600;padding:6px 0;cursor:pointer}
  textarea{width:100%;border:1px solid #d8d4ca;border-radius:10px;padding:10px;font:inherit;font-size:14.5px;margin:6px 0}
  .save{background:var(--gold);color:#fff}
  .done{margin-top:8px;font-weight:700;color:var(--teal);font-size:14px}
  .empty{text-align:center;color:#8a8578;margin-top:40px}
</style>
</head>
<body>
<header>
  <div class="k">Milez Ahead · WhatsApp Brain</div>
  <h1>Reply review</h1>
  <p>Tick what's good, rewrite what isn't. Every verdict teaches the brain.</p>
</header>
<div class="count" id="count">Loading…</div>
<div class="wrap" id="list"></div>
<script>
  // The review API lives on Supabase (JSON only — the gateway won't serve HTML,
  // which is why this page lives here). The k in the URL is the capability.
  const API = 'https://izslchhcavckowatgbel.supabase.co/functions/v1/concierge-review';
  const K = new URLSearchParams(location.search).get('k') || '';
  let pending = 0;

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text; // textContent everywhere — client-authored text never becomes markup
    return n;
  };

  function setCount() { document.getElementById('count').textContent = pending + ' to review'; }

  async function verdict(id, ok, card) {
    const ta = card.querySelector('textarea');
    const correction = ok ? '' : (ta.value || '').trim();
    if (!ok && !correction) { alert('Type the reply you would have sent first.'); return; }
    card.style.opacity = .5;
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ k: K, action: 'verdict', id, ok, correction }) }).catch(() => null);
    if (!r || !r.ok) { card.style.opacity = 1; alert('Could not save, please try again.'); return; }
    card.classList.add('rv'); card.style.opacity = .75;
    card.querySelector('.acts').style.display = 'none';
    card.appendChild(el('div', 'done', ok ? '✓ Approved' : '✎ Corrected, the brain will learn your reply'));
    pending = Math.max(0, pending - 1); setCount();
  }

  function render(rows) {
    const list = document.getElementById('list');
    if (!rows.length) { list.appendChild(el('p', 'empty', 'Nothing to review yet.')); return; }
    for (const r of rows) {
      const card = el('div', 'card' + (r.reviewed_at ? ' rv' : ''));
      card.appendChild(el('div', 'q', r.question));
      const a = el('div', 'a', r.reply || '(no reply sent)');
      const meta = el('div', 'meta');
      const badge = el('span', 'b ' + (r.action === 'answer' ? 'answer' : r.action === 'handoff' ? 'handoff' : 'silent'),
        r.action === 'answer' ? 'answered' : r.action === 'handoff' ? 'handed to consultant' : 'stayed silent');
      meta.appendChild(badge); a.appendChild(meta); card.appendChild(a);
      if (r.reviewed_at) {
        card.appendChild(el('div', 'done', r.reviewed_ok ? '✓ Approved' : r.learned_reply ? '✎ Corrected' : '✕ Rejected'));
      } else {
        pending++;
        const acts = el('div', 'acts');
        const okBtn = el('button', 'ok', '✓ Happy with this');
        okBtn.onclick = () => verdict(r.id, true, card);
        acts.appendChild(okBtn);
        const det = el('details');
        det.appendChild(el('summary', '', '✎ Give a better reply'));
        const ta = el('textarea'); ta.rows = 3; ta.placeholder = 'Type the reply you would have sent…';
        det.appendChild(ta);
        const save = el('button', 'save', 'Save my reply — the brain learns it');
        save.onclick = () => verdict(r.id, false, card);
        det.appendChild(save);
        acts.appendChild(det);
        card.appendChild(acts);
      }
      list.appendChild(card);
    }
    setCount();
  }

  fetch(API + '?k=' + encodeURIComponent(K))
    .then((r) => { if (!r.ok) throw 0; return r.json(); })
    .then((d) => render(d.rows || []))
    .catch(() => { document.getElementById('count').textContent = 'Could not load — check the link.'; });
</script>
</body>
</html>
