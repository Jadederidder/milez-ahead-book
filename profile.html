<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Milez Ahead — My Trips</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milez">
<link rel="apple-touch-icon" href="milez-icon-192.png">
<style>
  :root{ --navy:#1d2a4d; --teal:#0c8b86; --teal2:#13a89c; --gold:#c79a3b; --ink:#1f2430; --muted:#6b7280; --bg:#f4f1ea; --line:#e7e3da; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  /* The painted top — header + next trip flow as ONE navy→teal canvas ("Signature
     Flow" top, JD-approved 2026-08-20). Everything below it stays calm. */
  header{background:linear-gradient(160deg,#1d2a4d 0%,#14406b 34%,#0c8b86 78%,#13a89c 100%);color:#fff;padding:13px 16px 16px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
  header::before{content:'';position:absolute;top:-80px;right:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);pointer-events:none}
  header>*{position:relative}
  header .kick{font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:var(--gold);font-weight:700}
  header p{margin:2px 0 0;color:#fff;font-size:17px;font-weight:800}
  header .bal{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.14);padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
  /* Drawn line icons (no emoji) */
  svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
  /* Frosted action buttons living inside the paint */
  .actIn{flex:1;min-width:0;text-align:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:12px;padding:8px 2px;font-size:10.5px;font-weight:700;color:#fff;line-height:1.5;text-decoration:none;display:block;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .actIn .ic{display:block;margin:0 auto 2px;font-size:14px;color:#ffe9b8}
  .actIn.live{background:linear-gradient(135deg,var(--teal),var(--teal2));border-color:rgba(255,255,255,.2)}
  .actIn.live .ic{color:#fff}
  /* Tiles: calm white cards, colour lives in the icon-orbs; gold count badges */
  .tileF{position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 6px;text-align:center;box-shadow:0 2px 6px rgba(20,30,50,.06);display:block;width:100%;text-decoration:none}
  .orb{width:34px;height:34px;border-radius:12px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:16px}
  .o1{background:linear-gradient(150deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 4px 10px rgba(19,168,156,.35)}
  .o2{background:#e8f0fe;color:#2a5bd7}.o3{background:#f2ecff;color:#6d4fc4}
  .o4{background:#e6f6f0;color:#158a5c}.o5{background:#fdeeea;color:#d05438}.o6{background:#faf3e2;color:#b3872f}
  .o7{background:#e6f4f3;color:var(--teal)}
  .tileF .tl{font-size:11.5px;font-weight:800;color:var(--navy);margin-top:5px}
  .tileF .ts{font-size:10px;color:#8b8f98;margin-top:1px}
  .tileF .cnt{position:absolute;top:7px;right:7px;background:var(--gold);color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:2px 6px;box-shadow:0 2px 6px rgba(199,154,59,.4)}
  main{padding:16px 16px 30px;flex:1}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.06);padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:15px;color:var(--navy)}
  label.lab{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px}
  label.lab:first-of-type{margin-top:0}
  input,textarea,select{width:100%;font:15px inherit;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal)}
  .rm{border:none;background:none;color:#c0392b;font-size:22px;line-height:1;cursor:pointer;padding:0 4px;align-self:center}
  input[readonly]{background:#f6f5f1;color:var(--muted)}
  textarea{min-height:74px;resize:vertical}
  .hint{font-size:12px;color:var(--muted);margin:5px 0 0}
  .btn{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font-weight:800;font-size:16px}
  .btn:disabled{opacity:.6}
  .trip{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .trip:last-child{border-bottom:none}
  .trip .when{font-weight:700;color:var(--navy);font-size:14px}
  .trip .route{font-size:13px;color:var(--muted);margin-top:2px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pill.done{background:#e8f5ee;color:#137a45}.pill.live{background:#e7f0ff;color:#1f5fc0}.pill.cxl{background:#fdecec;color:#c0392b}.pill.pend{background:#fff4e0;color:#9a6a08}
  .fare{font-weight:800;color:var(--navy);font-size:14px;white-space:nowrap}
  .msg{padding:12px;border-radius:11px;font-size:14px;margin-bottom:12px;text-align:center}
  .msg.err{background:#fdecec;color:#c0392b}.msg.ok{background:#e8f5ee;color:#137a45}
  .center{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div style="min-width:0">
        <div class="kick">MILEZ AHEAD</div>
        <p id="sub">Loading your details…</p>
      </div>
      <span class="bal" id="bal" style="display:none"></span>
    </div>
    <div id="heroSlot"></div>
  </header>
  <main id="main"><div class="center">Loading…</div></main>
</div>
<script>
const FN='https://izslchhcavckowatgbel.supabase.co/functions/v1/client-profile';
const WA_NUM='27799722798';
const WA_ASK='https://wa.me/'+WA_NUM+'?text='+encodeURIComponent('Please send my secure Milez Ahead trips link');
// Tolerant token read. The code normally arrives as ?s=<token>, but a link can
// reach the client mangled — re-shared, copied by hand, or (2026-08-22) sent by
// a notice whose button carried no code at all. Accept every shape we've ever
// minted before concluding the link is codeless.
const Q=new URLSearchParams(location.search);
const H=new URLSearchParams((location.hash||'').replace(/^#/,''));
const S=Q.get('s')||Q.get('token')||Q.get('t')||H.get('s')||H.get('token')||'';
// Home-screen app support: remember the newest token so the installed icon
// works without a fresh WhatsApp link (tokens now live 30 days).
let TOKEN=S;
try{ if(S){localStorage.setItem('mz_s',S);} else {TOKEN=localStorage.getItem('mz_s')||'';} }catch(_){}
// Hardening: the token never lingers in the address bar / browser history —
// stored above, then stripped. The link itself still works everywhere.
try{ if(S){const u=new URL(location.href);['s','token','t'].forEach(k=>u.searchParams.delete(k));history.replaceState(null,'',u.pathname+(u.searchParams.toString()?'?'+u.searchParams.toString():'')+u.hash);} }catch(_){}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Drawn line icons — one visual voice, no emoji (the premium pass, 2026-08-20).
const _i=p=>`<svg class="ic" viewBox="0 0 24 24">${p}</svg>`;
const IC={
  phone:_i('<path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.7 3.4a2 2 0 0 1-.5 1.8l-1.3 1.3a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 1.8-.5l3.4.7a2 2 0 0 1 1.5 2z"/>'),
  person:_i('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>'),
  track:_i('<path d="M9 20l-5.5-2.2V4.5L9 6.7l6-2.2 5.5 2.2v13.3L15 17.8z"/><path d="M9 6.7v13.3M15 4.5v13.3"/>'),
  share:_i('<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4M12 2v13"/>'),
  cal:_i('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/>'),
  pencil:_i('<path d="M17 3l4 4L8 20l-5 1 1-5z"/>'),
  book:_i('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M12 13v5M9.5 15.5h5"/>'),
  case:_i('<rect x="5" y="7" width="14" height="14" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2M9 12h6"/>'),
  doc:_i('<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5M9 13h7M9 17h7"/>'),
  pin:_i('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
  gift:_i('<rect x="3" y="8" width="18" height="5"/><path d="M5 13v8h14v-8M12 8v13M12 8s-2.5-6-6-3.5S12 8 12 8zm0 0s2.5-6 6-3.5S12 8 12 8z"/>'),
};
const statusLabel=st=>({completed:'Completed',in_progress:'In progress',driver_confirmed:'Driver confirmed',driver_assigned:'Driver allocated',captured:'Received',awaiting_driver:'Arranging',cancelled:'Cancelled',no_show:'No-show'}[st]||st);
const money=n=>n==null?'':'R'+Number(n).toFixed(0);
async function call(payload){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:TOKEN,...payload})});return r.json();}
function pill(st){const m={completed:['done','Completed'],in_progress:['live','In progress'],driver_confirmed:['live','Driver confirmed'],driver_assigned:['live','Driver allocated'],captured:['pend','Received'],awaiting_driver:['pend','Arranging'],cancelled:['cxl','Cancelled'],no_show:['cxl','No-show']};const[c,l]=m[st]||['pend',st];return `<span class="pill ${c}">${l}</span>`;}
function fmt(d){if(!d)return '';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});}

// A codeless / expired link must NEVER look like a scam page. A bare red error
// on an unbranded screen is exactly what clients read as phishing (2026-08-22:
// a service notice went out with a codeless profile link and the control room
// spent the day reassuring people). So: full branding, plain explanation of why
// a code is needed, and one tap that gets them a working link.
function recovery(kind){
  const expired=kind==='expired';
  const sub=document.getElementById('sub');
  if(sub)sub.textContent=expired?'Your link has expired':"Let's get you back in";
  show(`
  <div class="card" style="text-align:center">
    <img src="milez-wa-header.png" alt="Milez Ahead" style="display:block;width:60%;max-width:200px;height:auto;margin:2px auto 14px">
    <div style="font-size:16px;font-weight:800;color:var(--navy);margin-bottom:8px">${expired?'This link has expired':'This link arrived without its code'}</div>
    <p style="font-size:14px;color:var(--muted);margin:0 0 8px">You are in the right place — this is the genuine Milez Ahead trips page.</p>
    <p style="font-size:14px;color:var(--muted);margin:0 0 16px">To keep your trips private, the page only opens from the personal link we send you on WhatsApp${expired?', and the code on this one has timed out':", and the one you tapped came through without its code"}. Tap below and we'll send you a fresh one straight away.</p>
    <a href="${WA_ASK}" style="display:block;margin-bottom:10px;background:linear-gradient(135deg,#25b563,#128c50);color:#fff;font-weight:800;font-size:15px;padding:14px;border-radius:14px;text-decoration:none;box-shadow:0 6px 16px rgba(18,140,80,.3)">💬 Send me my link on WhatsApp</a>
    <a href="tel:+${WA_NUM}" style="display:block;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:14px;padding:12px;border-radius:14px;text-decoration:none">📞 Call the control room</a>
    <p class="hint" style="margin-top:16px;text-align:center">We will never ask you for a password, an OTP or card details on this page.</p>
    <p class="hint" style="text-align:center;margin-top:10px">Milez Ahead · Executive Travel Concierge<br>+27 79 972 2798 · <a href="https://milezahead.co.za" style="color:var(--teal)">milezahead.co.za</a> · <a href="mailto:info@milezahead.co.za" style="color:var(--teal)">info@milezahead.co.za</a></p>
  </div>`);
}
async function load(){
  if(!TOKEN){recovery('missing');return;}
  let r;
  try{ r=await call({action:'context'}); }
  catch(_){ document.getElementById('sub').textContent='Connection problem'; show('<div class="msg err">We could not reach Milez Ahead just now — please check your signal and reload this page.</div>'); return; }
  if(r.error){
    // An expired/invalid code is the same conversation as a missing one: send
    // them for a fresh link, and drop the dead token so the app icon recovers too.
    if(/expired|missing|reopen/i.test(r.error)){try{localStorage.removeItem('mz_s');}catch(_){} recovery('expired'); return;}
    document.getElementById('sub').textContent='';show('<div class="msg err">'+esc(r.error)+'</div>');return;}
  const p=r.profile;
  document.getElementById('sub').textContent=p.full_name?('Hi '+p.full_name.split(' ')[0]+' 👋'):'Welcome';
  if(r.credits){const b=document.getElementById('bal');b.style.display='inline-block';b.textContent=`🎟 ${r.credits.left} of ${r.credits.total} rides left`;}
  window._data=r;
  render(p,r.trips||[],r.places||[]);
}
function placesRows(list){
  if(!list||!list.length)return '<div class="hint" style="padding:6px 0 2px">No saved places yet — add your Home, Work or airport below.</div>';
  return list.map(pl=>`<div class="trip"><div><div class="when">📍 ${esc(pl.label)}</div><div class="route">${esc(pl.address)}</div></div><button class="rm" onclick="delPlace('${pl.id}')" aria-label="Remove ${esc(pl.label)}">×</button></div>`).join('');
}
async function addPlace(){
  const label=document.getElementById('pl_label').value;
  const address=document.getElementById('pl_addr').value.trim();
  if(!address){alert('Please enter an address.');return;}
  const btn=document.getElementById('addPlace');btn.disabled=true;btn.textContent='Adding…';
  const r=await call({action:'place_add',label,address});
  btn.disabled=false;btn.textContent='Add place';
  if(r.error){alert(r.error);return;}
  window._data.places=r.places;document.getElementById('placesList').innerHTML=placesRows(r.places);document.getElementById('pl_addr').value='';
}
async function delPlace(id){
  const r=await call({action:'place_delete',id});
  if(r.error){alert(r.error);return;}
  window._data.places=r.places;document.getElementById('placesList').innerHTML=placesRows(r.places);
}
const CHANGEABLE=['captured','awaiting_driver','driver_assigned','driver_confirmed'];
function isUpcoming(t){return CHANGEABLE.includes(t.status)&&t.trip_date>=new Date().toISOString().slice(0,10);}
function tripRow(t,i){
  const to=t.dropoff_address||t.airport_code||'';const from=(t.pickup_address||'').split(',')[0];
  const canEdit=isUpcoming(t);
  return `<div class="trip" id="trip-${i}"><div style="min-width:0;flex:1">
    <div class="when">${fmt(t.trip_date)}${t.pickup_time?' · '+String(t.pickup_time).slice(0,5):''} ${pill(t.status)}</div>
    <div class="route">${esc(from)}${to?' → '+esc(String(to).split(',')[0]):''}</div>
    ${(t.stops||[]).map(st=>`<div class="route" style="font-size:12px;color:#8a8f98">➕ Extra ${st.kind==='pickup'?'pick-up':'drop-off'}: ${esc(String(st.address).split(',')[0])}</div>`).join('')}
    ${!canEdit&&t.status==='completed'?`<div style="margin-top:8px"><button type="button" onclick="bookAgain(${i})" style="border:1px solid var(--teal);background:#fff;color:var(--teal);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px">↻ Book again</button></div>`:''}
    ${canEdit?`<div style="margin-top:8px;display:flex;gap:8px">
      <button type="button" onclick="editTrip(${i})" style="border:1px solid var(--teal);background:#fff;color:var(--teal);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px">✏️ Change</button>
      <button type="button" onclick="cancelTrip(${i})" style="border:1px solid #e3b8b8;background:#fff;color:#c0392b;font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px">✕ Cancel</button>
    </div>
    <div id="edit-${i}" style="display:none;margin-top:10px;background:#f6f5f1;border:1px solid var(--line);border-radius:12px;padding:12px">
      <label class="lab">Date</label><input type="date" id="e-date-${i}" value="${esc(t.trip_date)}">
      <label class="lab">Pick-up time</label><select id="e-time-${i}">${timeOptions(t.pickup_time?String(t.pickup_time).slice(0,5):'')}</select>
      <label class="lab">Pick-up address</label><input id="e-pick-${i}" value="${esc(t.pickup_address||'')}">
      <label class="lab">Drop-off address</label><input id="e-drop-${i}" value="${esc(t.dropoff_address||'')}">
      <button class="btn" style="margin-top:12px" onclick="saveTrip(${i})">Save changes</button>
      <div class="hint" style="text-align:center;margin-top:6px">We'll send your updated confirmation on WhatsApp.</div>
    </div>`:''}
  </div><div class="fare">${money(t.fare)}</div></div>`;
}
async function saveTrip(i){
  const t=(window._data.trips||[])[i]; if(!t) return;
  const payload={action:'trip_amend',trip_id:t.id,trip_date:val('e-date-'+i),pickup_time:val('e-time-'+i),pickup_address:val('e-pick-'+i),dropoff_address:val('e-drop-'+i)};
  const r=await call(payload);
  if(r.error){alert(r.error);return;}
  await load();
  window.scrollTo(0,0);
}
async function cancelTrip(i){
  const t=(window._data.trips||[])[i]; if(!t) return;
  // Honest before, not after: inside the final hour the credit still counts
  // (driver already committed) — the client must know BEFORE confirming.
  const pickupMs=t.pickup_time?new Date(t.trip_date+'T'+t.pickup_time+'+02:00').getTime():null;
  const late=pickupMs!=null&&!isNaN(pickupMs)&&pickupMs-Date.now()<=60*60*1000;
  const warn=late?'\n\n⚠ Pickup is within the hour — cancelling now still uses 1 ride credit (your driver is already committed).':'';
  if(!confirm('Cancel this trip on '+fmt(t.trip_date)+'? This can\'t be undone.'+warn))return;
  const r=await call({action:'trip_cancel',trip_id:t.id});
  if(r.error){alert(r.error);return;}
  await load();
}
// WhatsApp's Android in-app browser CRASHES on native <input type=time> —
// a plain <select> of 15-min slots is bulletproof (and quicker to use).
function timeOptions(cur){
  let out=cur?'':'<option value="">Choose a time…</option>';
  const opts=[];
  for(let h=0;h<24;h++)for(let m=0;m<60;m+=15)opts.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
  if(cur&&!opts.includes(cur))opts.push(cur),opts.sort();
  for(const t of opts)out+='<option value="'+t+'"'+(t===cur?' selected':'')+'>'+t+'</option>';
  return out;
}
function editTrip(i){const el=document.getElementById('edit-'+i);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function val(id){const el=document.getElementById(id);return el?el.value:'';}
function render(p,trips,places){
  const upcoming=trips.filter(isUpcoming), past=trips.filter(t=>!isUpcoming(t));
  const tripsHtml=trips.length?(
    (upcoming.length?`<div class="lab" style="margin:0 0 4px">UPCOMING</div>`+upcoming.map(t=>tripRow(t,trips.indexOf(t))).join(''):'')+
    (past.length?`<div class="lab" style="margin:14px 0 4px">PAST</div>`+past.map(t=>tripRow(t,trips.indexOf(t))).join(''):'')
  ):'<div class="center">No trips yet.</div>';
  const next=upcoming[0];
  const nextIdx=next?trips.indexOf(next):-1;
  const daysTo=next?Math.ceil((new Date(next.trip_date+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5):0;
  const isToday=next&&daysTo<=0;
  const isLive=next&&(next.status==='in_progress'||(isToday&&next.driver));
  const when=next?(next.status==='in_progress'?'ON THE ROAD':isToday?'Today':daysTo===1?'Tomorrow':'In '+daysTo+' days'):'';
  const fs=next&&next.flight_status;
  const flightChip=next&&next.flight_number?(()=>{
    if(!fs)return `<div style="margin-top:8px;display:inline-block;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:999px;font-size:12px">✈️ ${esc(next.flight_number)} — we're watching it</div>`;
    const eta=fs.estimated_in?new Date(new Date(fs.estimated_in).getTime()+2*36e5).toISOString().slice(11,16):null;
    const state=fs.cancelled?'cancelled':fs.landed?('landed'+(eta?' '+eta:'')):Math.abs(fs.delay_min)<15?'on time':(fs.delay_min>0?fs.delay_min+' min late':(-fs.delay_min)+' min early');
    const tone=fs.cancelled?'rgba(255,99,99,.25)':Math.abs(fs.delay_min)>=15?'rgba(255,193,7,.25)':'rgba(74,222,128,.22)';

function toggleSec(k){const el=document.getElementById('sec-'+k);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function openSec(k){
  const target=document.getElementById('sec-'+k); if(!target) return;
  const wasOpen=target.style.display!=='none';
  document.querySelectorAll('.sec').forEach(el=>{el.style.display='none';});
  document.querySelectorAll('[id^="tile-"]').forEach(el=>{el.style.borderColor='var(--line)';el.style.boxShadow='0 1px 2px rgba(20,30,50,.05)';});
  if(!wasOpen){
    target.style.display='block';
    const tl=document.getElementById('tile-'+k); if(tl){tl.style.borderColor='var(--teal)';tl.style.boxShadow='0 0 0 2px rgba(12,139,134,.18)';}
    target.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function bookAgain(i){
  const t=(window._data.trips||[])[i]; if(!t) return;
  const q=new URLSearchParams({s:TOKEN,pick:t.pickup_address||'',drop:t.dropoff_address||t.airport_code||'',svc:t.service_type||''});
  location.href='book.html?'+q.toString();
}
function icsEsc(x){return String(x||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');}
function addToCal(i){
  const t=(window._data.trips||[])[i]; if(!t) return;
  const d=t.trip_date.replace(/-/g,'');const hm=(t.pickup_time||'09:00').slice(0,5).replace(':','');
  const dtStart=d+'T'+hm+'00';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Milez Ahead//Trips//EN','BEGIN:VEVENT',
    'UID:'+t.id+'@milezahead','DTSTART;TZID=Africa/Johannesburg:'+dtStart,
    'SUMMARY:'+icsEsc('Milez Ahead trip — '+(t.pickup_address||'').split(',')[0]+' → '+String(t.dropoff_address||t.airport_code||'').split(',')[0]),
    'LOCATION:'+icsEsc(t.pickup_address||''),
    'DESCRIPTION:'+icsEsc('Booking '+t.ref+'. Your driver will meet you at the pickup. Manage the trip: '+location.origin+'/profile.html'),
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');
  a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
  a.download='milez-trip-'+t.ref+'.ics';document.body.appendChild(a);a.click();a.remove();
}
async function rateTrip(n){
  const rp=window._data&&window._data.rate_prompt; if(!rp) return;
  const card=document.getElementById('rateCard');
  try{
    await fetch('https://izslchhcavckowatgbel.supabase.co/functions/v1/submit-feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:rp.tracking_token,trip_id:rp.trip_id,rating:n})});
    if(card)card.innerHTML='<div style="font-weight:800;color:var(--navy)">'+'★'.repeat(n)+'</div><div class="hint" style="margin-top:4px">Thank you! Your feedback keeps Milez world-class. 🌟</div>';
  }catch(_){ if(card)card.innerHTML='<div class="hint">Could not save just now — please try again later.</div>'; }
}
async function shareRide(i){
  const t=(window._data.trips||[])[i]; if(!t||!t.tracking_token) return;
  const url=location.origin+'/track.html?token='+encodeURIComponent(t.tracking_token);
  const text='Follow my Milez Ahead trip live: '+url;
  if(navigator.share){ try{ await navigator.share({title:'Follow my trip',text:text}); return; }catch(_){} }
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
async function callMe(btn){
  btn.disabled=true;const was=btn.textContent;btn.textContent='Requesting…';
  const r=await call({action:'callback'});
  btn.textContent=r&&!r.error?'✓ We\'ll phone you shortly':was;
  if(r&&r.error){alert(r.error);btn.disabled=false;btn.textContent=was;}
}
async function sendPdf(){
  // WhatsApp's in-app browser silently blocks file downloads (Mrs Brand, Mrs
  // Steenberg — Aug 2026), so the statement is DELIVERED into their own chat
  // instead: same PDF, sent as a WhatsApp document via the server.
  const btn=document.getElementById('pdfBtn'); if(btn){btn.disabled=true;btn.textContent='Sending to your WhatsApp…';}
  try{
    const doc=await buildStatementDoc();
    const b64=btoa(new Uint8Array(doc.output('arraybuffer')).reduce((a,c)=>a+String.fromCharCode(c),''));
    // TOKEN, not location.search: the page scrubs ?s= from the address bar on
    // load (history hardening), so the URL is ALWAYS bare here — reading it
    // meant every send went out tokenless and 401'd into the download
    // fallback (JD + a live client, 24-25 Aug). Same source as call().
    const r=await fetch('https://izslchhcavckowatgbel.supabase.co/functions/v1/send-client-pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({s:TOKEN,filename:'Milez-Ahead-statement.pdf',pdf_base64:b64})});
    if(!r.ok) throw new Error('send failed');
    if(btn){btn.textContent='✅ Sent — check your WhatsApp';}
    setTimeout(()=>{if(btn){btn.disabled=false;btn.textContent='📄 Send my statement to this WhatsApp';}},8000);
    return;
  }catch(e){
    // Fall back to the old browser download (works in a real browser).
    if(btn){btn.textContent='Preparing download…';}
    try{ await savePdf(); }finally{ if(btn){btn.disabled=false;btn.textContent='📄 Send my statement to this WhatsApp';} }
  }
}
// The branded statement PDF — ONE builder for both delivery paths (send-to-
// WhatsApp and browser download). Design: navy masthead with the gold lockup,
// client block, credits summary, zebra table with a per-trip Credits column,
// totals, footer. helvetica lacks the → glyph (the old build printed garbage
// where arrows should be — JD, 24 Aug), so routes use "to".
async function buildStatementDoc(){
  const d=window._data; if(!d) throw new Error('no data');
  const { jsPDF } = await import('https://esm.sh/jspdf@2.5.1');
  const doc=new jsPDF({unit:'pt',format:'a4'});
  const W=595, M=42, R=W-M;
  const NAVY=[16,34,69], GOLD=[201,162,39], TEAL=[13,79,74], INK=[30,36,46], MUT=[110,116,126];
  const trips=(d.trips||[]);
  const isMember=!!d.credits;
  let page=1;

  function masthead(){
    doc.setFillColor(NAVY[0],NAVY[1],NAVY[2]); doc.rect(0,0,W,84,'F');
    doc.setFillColor(GOLD[0],GOLD[1],GOLD[2]); doc.rect(0,84,W,3,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(255,255,255);
    doc.text('MILEZ',M,40);
    doc.setTextColor(GOLD[0],GOLD[1],GOLD[2]); doc.text('AHEAD',M+72,40);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(220,224,232);
    doc.text('Executive Travel Concierge',M,56);
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(255,255,255);
    doc.text('My Statement',R,40,{align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(220,224,232);
    doc.text(new Date().toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'}),R,56,{align:'right'});
  }
  function tableHead(y){
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(TEAL[0],TEAL[1],TEAL[2]);
    doc.text('DATE',M,y); doc.text('REF',M+72,y); doc.text('TRIP',M+178,y);
    if(isMember) doc.text('CREDITS',R-70,y,{align:'right'});
    doc.text('FARE',R,y,{align:'right'});
    doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]); doc.setLineWidth(1); doc.line(M,y+6,R,y+6);
    return y+20;
  }
  function footer(){
    doc.setDrawColor(225); doc.setLineWidth(0.5); doc.line(M,806,R,806);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
    doc.text('Milez Ahead · Executive Travel Concierge · +27 79 972 2798 · milezahead.co.za',M,820);
    doc.text('Page '+page,R,820,{align:'right'});
  }

  masthead();
  let y=112;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text(d.profile.full_name||'',M,y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(MUT[0],MUT[1],MUT[2]);
  if(d.profile.phone) doc.text(String(d.profile.phone),M,y+15);
  if(isMember){
    // Credits chip, right-aligned: "95 of 100 rides left · 5 used"
    const txt=`${d.credits.left} of ${d.credits.total} rides left  ·  ${d.credits.used} used`;
    const tw=doc.getTextWidth(txt)+24;
    doc.setFillColor(240,246,244); doc.setDrawColor(TEAL[0],TEAL[1],TEAL[2]); doc.setLineWidth(0.8);
    doc.roundedRect(R-tw,y-14,tw,26,13,13,'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(TEAL[0],TEAL[1],TEAL[2]);
    doc.text(txt,R-tw/2,y+3,{align:'center'});
  }
  y+=40;
  y=tableHead(y);

  doc.setFontSize(9);
  let totCredits=0, totFare=0, shaded=false;
  trips.forEach(t=>{
    const from=(t.pickup_address||t.airport_code||'').split(',')[0];
    const to=(t.dropoff_address||t.airport_code||'').split(',')[0];
    const stops=(t.stops||[]).length;
    const route=(from&&to)?`${from} to ${to}`:(from||to||'');
    const tripTxt=route+(stops?`  (+${stops} stop${stops>1?'':''}${stops>1?'s':''})`:'');
    const lines=doc.splitTextToSize(tripTxt, isMember?170:230).slice(0,2);
    const rowH=Math.max(18, lines.length*11+7);
    if(y+rowH>790){ footer(); doc.addPage(); page++; masthead(); y=tableHead(112); shaded=false; }
    if(shaded){ doc.setFillColor(246,245,241); doc.rect(M-6,y-11,R-M+12,rowH,'F'); }
    shaded=!shaded;
    doc.setFont('helvetica','normal'); doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text(String(t.trip_date||''),M,y);
    doc.setTextColor(MUT[0],MUT[1],MUT[2]);
    doc.text(String(t.ref||'').replace(/^DRV-|^MUA-/,'').slice(0,14),M+72,y);
    doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text(lines,M+178,y);
    const cr=(t.status==='cancelled'||t.status==='no_show')?0:(t.credits_effective!=null?Number(t.credits_effective):1);
    if(isMember){ totCredits+=cr; doc.text(cr?String(cr):'—',R-70,y,{align:'right'}); }
    if(t.fare!=null){ totFare+=Number(t.fare); doc.setTextColor(MUT[0],MUT[1],MUT[2]); doc.text('R'+Number(t.fare).toFixed(0),R,y,{align:'right'}); }
    y+=rowH;
  });
  if(!trips.length){ doc.setFont('helvetica','normal'); doc.setTextColor(MUT[0],MUT[1],MUT[2]); doc.text('No trips yet.',M,y); y+=16; }

  // Totals band.
  doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]); doc.setLineWidth(1); doc.line(M,y-4,R,y-4); y+=12;
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);
  doc.text(`${trips.length} trip${trips.length===1?'':'s'} on record`,M,y);
  if(isMember) doc.text(`${totCredits} credit${totCredits===1?'':'s'} used`,R-70,y,{align:'right'});
  if(totFare>0) doc.text('R'+totFare.toFixed(0),R,y,{align:'right'});
  footer();
  return doc;
}
async function savePdf(){
  const btn=document.getElementById('pdfBtn'); if(btn){btn.disabled=true;btn.textContent='Preparing…';}
  try{
    const doc=await buildStatementDoc();
    doc.save('Milez-Ahead-statement.pdf');
  }catch(e){ alert('Could not build the PDF — please try again.'); }
  finally{ if(btn){btn.disabled=false;btn.textContent='📄 Send my statement to this WhatsApp';} }
}
async function save(){
  const btn=document.getElementById('save');btn.disabled=true;btn.textContent='Saving…';
  const r=await call({action:'save',
    full_name:document.getElementById('full_name').value,
    email:document.getElementById('email').value,
    alt_contact:document.getElementById('alt_contact').value,
    special_requirements:document.getElementById('special_requirements').value});
  btn.disabled=false;btn.textContent='Save my details';
  const s=document.getElementById('saved');
  if(r.error){alert(r.error);}else{s.style.display='block';setTimeout(()=>s.style.display='none',2500);}
}
function show(html){document.getElementById('main').innerHTML=html;}
load();
</script>
