<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Milez Ahead — My Trips</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Milez">
<link rel="apple-touch-icon" href="milez-icon-192.png">
<style>
  :root{ --navy:#1d2a4d; --teal:#0c8b86; --teal2:#13a89c; --gold:#c79a3b; --ink:#1f2430; --muted:#6b7280; --bg:#f4f1ea; --line:#e7e3da; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,var(--navy),#0c5c5a);color:#fff;padding:24px 22px 26px;border-radius:0 0 22px 22px}
  header .kick{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:700}
  header h1{margin:8px 0 2px;font-size:23px;font-weight:800}
  header p{margin:0;color:#cfe0e2;font-size:14px}
  header .bal{margin-top:12px;display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
  main{padding:16px 16px 30px;flex:1}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.06);padding:16px;margin-bottom:14px}
  .card h2{margin:0 0 12px;font-size:15px;color:var(--navy)}
  label.lab{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px}
  label.lab:first-of-type{margin-top:0}
  input,textarea,select{width:100%;font:15px inherit;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal)}
  .rm{border:none;background:none;color:#c0392b;font-size:22px;line-height:1;cursor:pointer;padding:0 4px;align-self:center}
  input[readonly]{background:#f6f5f1;color:var(--muted)}
  textarea{min-height:74px;resize:vertical}
  .hint{font-size:12px;color:var(--muted);margin:5px 0 0}
  .btn{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;font-weight:800;font-size:16px}
  .btn:disabled{opacity:.6}
  .trip{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .trip:last-child{border-bottom:none}
  .trip .when{font-weight:700;color:var(--navy);font-size:14px}
  .trip .route{font-size:13px;color:var(--muted);margin-top:2px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pill.done{background:#e8f5ee;color:#137a45}.pill.live{background:#e7f0ff;color:#1f5fc0}.pill.cxl{background:#fdecec;color:#c0392b}.pill.pend{background:#fff4e0;color:#9a6a08}
  .fare{font-weight:800;color:var(--navy);font-size:14px;white-space:nowrap}
  .msg{padding:12px;border-radius:11px;font-size:14px;margin-bottom:12px;text-align:center}
  .msg.err{background:#fdecec;color:#c0392b}.msg.ok{background:#e8f5ee;color:#137a45}
  .center{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kick">MILEZ AHEAD</div>
    <h1>My profile</h1>
    <p id="sub">Loading your details…</p>
    <span class="bal" id="bal" style="display:none"></span>
  </header>
  <main id="main"><div class="center">Loading…</div></main>
</div>
<script>
const FN='https://izslchhcavckowatgbel.supabase.co/functions/v1/client-profile';
const S=new URLSearchParams(location.search).get('s')||'';
// Home-screen app support: remember the newest token so the installed icon
// works without a fresh WhatsApp link (tokens now live 30 days).
let TOKEN=S;
try{ if(S){localStorage.setItem('mz_s',S);} else {TOKEN=localStorage.getItem('mz_s')||'';} }catch(_){}
// Hardening: the token never lingers in the address bar / browser history —
// stored above, then stripped. The link itself still works everywhere.
try{ if(S){const u=new URL(location.href);u.searchParams.delete('s');history.replaceState(null,'',u.pathname+(u.searchParams.toString()?'?'+u.searchParams.toString():'')+u.hash);} }catch(_){}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>n==null?'':'R'+Number(n).toFixed(0);
async function call(payload){const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:TOKEN,...payload})});return r.json();}
function pill(st){const m={completed:['done','Completed'],in_progress:['live','In progress'],driver_confirmed:['live','Driver confirmed'],driver_assigned:['live','Driver allocated'],captured:['pend','Received'],awaiting_driver:['pend','Arranging'],cancelled:['cxl','Cancelled'],no_show:['cxl','No-show']};const[c,l]=m[st]||['pend',st];return `<span class="pill ${c}">${l}</span>`;}
function fmt(d){if(!d)return '';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});}

async function load(){
  if(!TOKEN){show('<div class="msg err">This link is missing its code. Please reopen <b>My profile</b> from WhatsApp.</div>');return;}
  const r=await call({action:'context'});
  if(r.error){document.getElementById('sub').textContent='';show('<div class="msg err">'+esc(r.error)+'</div>');return;}
  const p=r.profile;
  document.getElementById('sub').textContent=p.full_name?('Hi '+p.full_name.split(' ')[0]+' 👋'):'Welcome';
  if(r.credits){const b=document.getElementById('bal');b.style.display='inline-block';b.textContent=`🎟 ${r.credits.left} of ${r.credits.total} rides left this year`;}
  window._data=r;
  render(p,r.trips||[],r.places||[]);
}
function placesRows(list){
  if(!list||!list.length)return '<div class="hint" style="padding:6px 0 2px">No saved places yet — add your Home, Work or airport below.</div>';
  return list.map(pl=>`<div class="trip"><div><div class="when">📍 ${esc(pl.label)}</div><div class="route">${esc(pl.address)}</div></div><button class="rm" onclick="delPlace('${pl.id}')" aria-label="Remove ${esc(pl.label)}">×</button></div>`).join('');
}
async function addPlace(){
  const label=document.getElementById('pl_label').value;
  const address=document.getElementById('pl_addr').value.trim();
  if(!address){alert('Please enter an address.');return;}
  const btn=document.getElementById('addPlace');btn.disabled=true;btn.textContent='Adding…';
  const r=await call({action:'place_add',label,address});
  btn.disabled=false;btn.textContent='Add place';
  if(r.error){alert(r.error);return;}
  window._data.places=r.places;document.getElementById('placesList').innerHTML=placesRows(r.places);document.getElementById('pl_addr').value='';
}
async function delPlace(id){
  const r=await call({action:'place_delete',id});
  if(r.error){alert(r.error);return;}
  window._data.places=r.places;document.getElementById('placesList').innerHTML=placesRows(r.places);
}
const CHANGEABLE=['captured','awaiting_driver','driver_assigned','driver_confirmed'];
function isUpcoming(t){return CHANGEABLE.includes(t.status)&&t.trip_date>=new Date().toISOString().slice(0,10);}
function tripRow(t,i){
  const to=t.dropoff_address||t.airport_code||'';const from=(t.pickup_address||'').split(',')[0];
  const canEdit=isUpcoming(t);
  return `<div class="trip" id="trip-${i}"><div style="min-width:0;flex:1">
    <div class="when">${fmt(t.trip_date)}${t.pickup_time?' · '+String(t.pickup_time).slice(0,5):''} ${pill(t.status)}</div>
    <div class="route">${esc(from)}${to?' → '+esc(String(to).split(',')[0]):''}</div>
    ${!canEdit&&t.status==='completed'?`<div style="margin-top:8px"><button type="button" onclick="bookAgain(${i})" style="border:1px solid var(--teal);background:#fff;color:var(--teal);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px">↻ Book again</button></div>`:''}
    ${canEdit?`<div style="margin-top:8px;display:flex;gap:8px">
      <button type="button" onclick="editTrip(${i})" style="border:1px solid var(--teal);background:#fff;color:var(--teal);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px">✏️ Change</button>
      <button type="button" onclick="cancelTrip(${i})" style="border:1px solid #e3b8b8;background:#fff;color:#c0392b;font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px">✕ Cancel</button>
    </div>
    <div id="edit-${i}" style="display:none;margin-top:10px;background:#f6f5f1;border:1px solid var(--line);border-radius:12px;padding:12px">
      <label class="lab">Date</label><input type="date" id="e-date-${i}" value="${esc(t.trip_date)}">
      <label class="lab">Pick-up time</label><select id="e-time-${i}">${timeOptions(t.pickup_time?String(t.pickup_time).slice(0,5):'')}</select>
      <label class="lab">Pick-up address</label><input id="e-pick-${i}" value="${esc(t.pickup_address||'')}">
      <label class="lab">Drop-off address</label><input id="e-drop-${i}" value="${esc(t.dropoff_address||'')}">
      <button class="btn" style="margin-top:12px" onclick="saveTrip(${i})">Save changes</button>
      <div class="hint" style="text-align:center;margin-top:6px">We'll send your updated confirmation on WhatsApp.</div>
    </div>`:''}
  </div><div class="fare">${money(t.fare)}</div></div>`;
}
async function saveTrip(i){
  const t=(window._data.trips||[])[i]; if(!t) return;
  const payload={action:'trip_amend',trip_id:t.id,trip_date:val('e-date-'+i),pickup_time:val('e-time-'+i),pickup_address:val('e-pick-'+i),dropoff_address:val('e-drop-'+i)};
  const r=await call(payload);
  if(r.error){alert(r.error);return;}
  await load();
  window.scrollTo(0,0);
}
async function cancelTrip(i){
  const t=(window._data.trips||[])[i]; if(!t) return;
  if(!confirm('Cancel this trip on '+fmt(t.trip_date)+'? This can\'t be undone.'))return;
  const r=await call({action:'trip_cancel',trip_id:t.id});
  if(r.error){alert(r.error);return;}
  await load();
}
// WhatsApp's Android in-app browser CRASHES on native <input type=time> —
// a plain <select> of 15-min slots is bulletproof (and quicker to use).
function timeOptions(cur){
  let out=cur?'':'<option value="">Choose a time…</option>';
  const opts=[];
  for(let h=0;h<24;h++)for(let m=0;m<60;m+=15)opts.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
  if(cur&&!opts.includes(cur))opts.push(cur),opts.sort();
  for(const t of opts)out+='<option value="'+t+'"'+(t===cur?' selected':'')+'>'+t+'</option>';
  return out;
}
function editTrip(i){const el=document.getElementById('edit-'+i);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function val(id){const el=document.getElementById(id);return el?el.value:'';}
function render(p,trips,places){
  const upcoming=trips.filter(isUpcoming), past=trips.filter(t=>!isUpcoming(t));
  const tripsHtml=trips.length?(
    (upcoming.length?`<div class="lab" style="margin:0 0 4px">UPCOMING</div>`+upcoming.map(t=>tripRow(t,trips.indexOf(t))).join(''):'')+
    (past.length?`<div class="lab" style="margin:14px 0 4px">PAST</div>`+past.map(t=>tripRow(t,trips.indexOf(t))).join(''):'')
  ):'<div class="center">No trips yet.</div>';
  const next=upcoming[0];
  const nextIdx=next?trips.indexOf(next):-1;
  const daysTo=next?Math.ceil((new Date(next.trip_date+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5):0;
  const isToday=next&&daysTo<=0;
  const isLive=next&&(next.status==='in_progress'||(isToday&&next.driver));
  const when=next?(next.status==='in_progress'?'ON THE ROAD':isToday?'Today':daysTo===1?'Tomorrow':'In '+daysTo+' days'):'';
  const fs=next&&next.flight_status;
  const flightChip=next&&next.flight_number?(()=>{
    if(!fs)return `<div style="margin-top:8px;display:inline-block;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:999px;font-size:12px">✈️ ${esc(next.flight_number)} — we're watching it</div>`;
    const eta=fs.estimated_in?new Date(new Date(fs.estimated_in).getTime()+2*36e5).toISOString().slice(11,16):null;
    const state=fs.cancelled?'cancelled':fs.landed?('landed'+(eta?' '+eta:'')):Math.abs(fs.delay_min)<15?'on time':(fs.delay_min>0?fs.delay_min+' min late':(-fs.delay_min)+' min early');
    const tone=fs.cancelled?'rgba(255,99,99,.25)':Math.abs(fs.delay_min)>=15?'rgba(255,193,7,.25)':'rgba(74,222,128,.22)';
    return `<div style="margin-top:8px;display:inline-block;background:${tone};padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600">✈️ ${esc(fs.ident||next.flight_number)} · ${state}${eta&&!fs.landed?' · lands ~'+eta:''}</div>`;
  })():'';
  const drv=next&&next.driver;const veh=next&&next.vehicle;
  const driverCard=drv?`
      <div style="margin-top:12px;display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:11px 13px">
        <div style="width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;border:2px solid rgba(199,154,59,.6)">${esc((drv.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase())}</div>
        <div style="min-width:0;flex:1">
          <div style="font-weight:800;font-size:14px">${esc(drv.name||'Your driver')}</div>
          ${veh?`<div style="font-size:12px;color:#cfe0e2">${esc([veh.make,veh.model].filter(Boolean).join(' '))} · ${esc(veh.registration||'')}</div>`:''}
        </div>
        ${drv.phone?`<a href="tel:${esc(drv.phone)}" style="background:rgba(255,255,255,.16);border-radius:999px;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px;font-weight:700">📞</a>`:''}
        ${next.tracking_token?`<a href="driver.html?t=${encodeURIComponent(next.tracking_token)}" style="background:rgba(255,255,255,.16);border-radius:999px;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px;font-weight:700">👤</a>`:''}
      </div>`:'';
  const liveRow=next&&next.tracking_token?`
      <div style="margin-top:10px;display:flex;gap:8px">
        <a href="track.html?token=${encodeURIComponent(next.tracking_token)}" style="flex:1;text-align:center;background:${isLive?'linear-gradient(135deg,var(--teal),var(--teal2))':'rgba(255,255,255,.14)'};border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:800;font-size:13px;padding:10px;border-radius:11px;text-decoration:none">${isLive?'🔴 Track live':'🗺 Track my trip'}</a>
        <button type="button" onclick="shareRide(${nextIdx})" style="flex:1;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#fff;font-weight:800;font-size:13px;padding:10px;border-radius:11px">📤 Share my ride</button>
      </div>`:'';
  const heroHtml=next?`
    <div style="background:linear-gradient(135deg,var(--navy),#0c5c5a);border-radius:18px;padding:18px;color:#fff;margin-bottom:14px;box-shadow:0 8px 24px rgba(20,30,50,.18)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700">${isLive?'Trip in progress':'Your next trip'}</span>
        <span style="background:${isLive?'rgba(74,222,128,.25)':'rgba(255,255,255,.16)'};padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700">${when}</span>
      </div>
      <div style="font-size:22px;font-weight:800;margin:10px 0 2px">${fmt(next.trip_date)}${next.pickup_time?' · '+String(next.pickup_time).slice(0,5):''}</div>
      <div style="font-size:14px;color:#cfe0e2;line-height:1.45">${esc((next.pickup_address||'').split(',')[0])} → ${esc(String(next.dropoff_address||next.airport_code||'').split(',')[0])}</div>
      <div style="margin-top:6px">${pill(next.status)}</div>
      ${flightChip}
      ${driverCard}
      ${liveRow}
      <div style="margin-top:10px;display:flex;gap:8px">
        <button type="button" onclick="addToCal(${nextIdx})" style="flex:1;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:13px;padding:10px;border-radius:11px">🗓 Add to calendar</button>
      </div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button type="button" onclick="openSec('trips');editTrip(${nextIdx})" style="flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:700;font-size:13px;padding:10px;border-radius:11px">✏️ Change</button>
        <button type="button" onclick="cancelTrip(${nextIdx})" style="flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,120,120,.4);color:#ffd9d9;font-weight:700;font-size:13px;padding:10px;border-radius:11px">✕ Cancel</button>
      </div>
    </div>`:`
    <div style="background:linear-gradient(135deg,var(--navy),#0c5c5a);border-radius:18px;padding:22px;color:#fff;margin-bottom:14px;text-align:center">
      <div style="font-size:19px;font-weight:800">Where to next?</div>
      <div style="font-size:13px;color:#cfe0e2;margin-top:4px">No upcoming trips — your driver is a few taps away.</div>
    </div>`;

  const tile=(id,icon,label,badge)=>`<button type="button" onclick="openSec('${id}')" id="tile-${id}" style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;box-shadow:0 1px 2px rgba(20,30,50,.05)">
      <div style="font-size:24px">${icon}</div>
      <div style="font-size:13px;font-weight:800;color:var(--navy);margin-top:6px">${label}</div>
      ${badge?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${badge}</div>`:''}
    </button>`;

  const rp=(window._data&&window._data.rate_prompt)||null;
  const rateHtml=rp?`
    <div class="card" id="rateCard" style="text-align:center">
      <div style="font-weight:800;color:var(--navy);font-size:14px">How was your trip on ${fmt(rp.trip_date)}?</div>
      <div style="margin-top:8px;font-size:30px;letter-spacing:6px">${[1,2,3,4,5].map(n=>`<span style="cursor:pointer" onclick="rateTrip(${n})">☆</span>`).join('')}</div>
      <div class="hint" style="margin-top:4px">Tap a star — it takes one second.</div>
    </div>`:'';
  show(`
    ${heroHtml}
    ${rateHtml}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px">
      <a href="book.html?s=${encodeURIComponent(TOKEN)}" style="display:block;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-radius:16px;padding:16px 8px;text-align:center;text-decoration:none;box-shadow:0 1px 2px rgba(20,30,50,.08)">
        <div style="font-size:24px">📅</div><div style="font-size:13px;font-weight:800;margin-top:6px">Book a trip</div>
      </a>
      ${tile('trips','🧳','My trips', upcoming.length+' upcoming')}
      ${tile('statement','📄','Statement','')}
      ${tile('details','👤','My details','')}
      ${tile('places','📍','My places', places.length? places.length+' saved':'')}
      ${p.gift_token?`<a href="gift.html?m=${encodeURIComponent(p.gift_token)}" style="display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;text-decoration:none;box-shadow:0 1px 2px rgba(20,30,50,.05)">
        <div style="font-size:24px">🎁</div><div style="font-size:13px;font-weight:800;color:var(--navy);margin-top:6px">Gift a trip</div>
      </a>`:`<button type="button" onclick="callMe(this)" style="background:#fff;border:1.5px solid var(--teal);border-radius:16px;padding:16px 8px;text-align:center">
        <div style="font-size:24px">📞</div><div style="font-size:13px;font-weight:800;color:var(--teal);margin-top:6px">Call me</div>
      </button>`}
    </div>
    ${p.gift_token?`<button type="button" onclick="callMe(this)" style="display:block;width:100%;margin-bottom:14px;background:#fff;border:1.5px solid var(--teal);color:var(--teal);font-weight:800;font-size:14px;padding:13px;border-radius:14px">📞 Call me</button>`:''}

    <a href="https://wa.me/27799722798" style="display:block;margin-bottom:14px;background:#25D366;color:#fff;font-weight:800;font-size:14px;padding:13px;border-radius:14px;text-align:center;text-decoration:none;box-shadow:0 1px 2px rgba(20,30,50,.08)">💬 Chat to us on WhatsApp</a>

    <div class="card sec" id="sec-trips" style="display:none">
      <h2>My trips</h2>
      ${upcoming.length?`<div class="lab" style="margin:0 0 4px">UPCOMING</div>`+upcoming.map(t=>tripRow(t,trips.indexOf(t))).join(''):'<div class="hint">No upcoming trips.</div>'}
      ${past.length?`
        <button type="button" onclick="toggleSec('past')" style="margin-top:14px;width:100%;text-align:left;background:#f6f5f1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:700;font-size:13px;color:var(--navy)">Past trips · ${past.length} <span style="float:right;color:#9aa1ab">▾</span></button>
        <div id="sec-past" style="display:none;margin-top:8px">${past.map(t=>tripRow(t,trips.indexOf(t))).join('')}</div>`:''}
    </div>

    <div class="card sec" id="sec-statement" style="display:none">
      <h2>My statement</h2>
      ${trips.length?'<button class="btn" id="pdfBtn" onclick="savePdf()" style="margin:0;background:var(--navy)">📄 Download my statement (PDF)</button>':'<div class="hint">Your statement appears once you have trips.</div>'}
    </div>

    <div class="card sec" id="sec-details" style="display:none">
      <h2>Your details</h2>
      <div class="msg ok" id="saved" style="display:none">Saved ✓</div>
      <label class="lab">Full name</label><input id="full_name" value="${esc(p.full_name)}">
      <label class="lab">Email</label><input id="email" type="email" value="${esc(p.email)}" placeholder="you@example.com">
      <label class="lab">Alternative contact</label><input id="alt_contact" value="${esc(p.alt_contact)}" placeholder="A second number / next of kin">
      <label class="lab">Special requirements</label><textarea id="special_requirements" placeholder="e.g. wheelchair access · male driver · no music">${esc(p.special_requirements)}</textarea>
      <div class="hint">Shown to your controller on every trip.</div>
      <label class="lab">Phone</label><input value="${esc(p.phone)}" readonly>
      ${p.policy_number?`<label class="lab">Policy number</label><input value="${esc(p.policy_number)}" readonly>`:''}
      <button class="btn" id="save" onclick="save()">Save my details</button>
    </div>

    <div class="card sec" id="sec-places" style="display:none">
      <h2>My places</h2>
      <div class="hint" style="margin:-6px 0 10px">Save the addresses you use most — Home, Work, your airport — so booking is one tap.</div>
      <div id="placesList">${placesRows(places)}</div>
      <label class="lab">Add a place</label>
      <select id="pl_label"><option>Home</option><option>Work</option><option>Airport</option><option>Gym</option><option>Family</option><option>Other</option></select>
      <input id="pl_addr" placeholder="Start typing the address" style="margin-top:8px">
      <button class="btn" id="addPlace" onclick="addPlace()" style="margin-top:12px">Add place</button>
    </div>
  `);
}
function toggleSec(k){const el=document.getElementById('sec-'+k);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function openSec(k){
  const target=document.getElementById('sec-'+k); if(!target) return;
  const wasOpen=target.style.display!=='none';
  document.querySelectorAll('.sec').forEach(el=>{el.style.display='none';});
  document.querySelectorAll('[id^="tile-"]').forEach(el=>{el.style.borderColor='var(--line)';el.style.boxShadow='0 1px 2px rgba(20,30,50,.05)';});
  if(!wasOpen){
    target.style.display='block';
    const tl=document.getElementById('tile-'+k); if(tl){tl.style.borderColor='var(--teal)';tl.style.boxShadow='0 0 0 2px rgba(12,139,134,.18)';}
    target.scrollIntoView({behavior:'smooth',block:'start'});
  }
}
function bookAgain(i){
  const t=(window._data.trips||[])[i]; if(!t) return;
  const q=new URLSearchParams({s:TOKEN,pick:t.pickup_address||'',drop:t.dropoff_address||t.airport_code||'',svc:t.service_type||''});
  location.href='book.html?'+q.toString();
}
function icsEsc(x){return String(x||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');}
function addToCal(i){
  const t=(window._data.trips||[])[i]; if(!t) return;
  const d=t.trip_date.replace(/-/g,'');const hm=(t.pickup_time||'09:00').slice(0,5).replace(':','');
  const dtStart=d+'T'+hm+'00';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Milez Ahead//Trips//EN','BEGIN:VEVENT',
    'UID:'+t.id+'@milezahead','DTSTART;TZID=Africa/Johannesburg:'+dtStart,
    'SUMMARY:'+icsEsc('Milez Ahead trip — '+(t.pickup_address||'').split(',')[0]+' → '+String(t.dropoff_address||t.airport_code||'').split(',')[0]),
    'LOCATION:'+icsEsc(t.pickup_address||''),
    'DESCRIPTION:'+icsEsc('Booking '+t.ref+'. Your driver will meet you at the pickup. Manage the trip: '+location.origin+'/profile.html'),
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');
  a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
  a.download='milez-trip-'+t.ref+'.ics';document.body.appendChild(a);a.click();a.remove();
}
async function rateTrip(n){
  const rp=window._data&&window._data.rate_prompt; if(!rp) return;
  const card=document.getElementById('rateCard');
  try{
    await fetch('https://izslchhcavckowatgbel.supabase.co/functions/v1/submit-feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:rp.tracking_token,trip_id:rp.trip_id,rating:n})});
    if(card)card.innerHTML='<div style="font-weight:800;color:var(--navy)">'+'★'.repeat(n)+'</div><div class="hint" style="margin-top:4px">Thank you! Your feedback keeps Milez world-class. 🌟</div>';
  }catch(_){ if(card)card.innerHTML='<div class="hint">Could not save just now — please try again later.</div>'; }
}
async function shareRide(i){
  const t=(window._data.trips||[])[i]; if(!t||!t.tracking_token) return;
  const url=location.origin+'/track.html?token='+encodeURIComponent(t.tracking_token);
  const text='Follow my Milez Ahead trip live: '+url;
  if(navigator.share){ try{ await navigator.share({title:'Follow my trip',text:text}); return; }catch(_){} }
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
async function callMe(btn){
  btn.disabled=true;const was=btn.textContent;btn.textContent='Requesting…';
  const r=await call({action:'callback'});
  btn.textContent=r&&!r.error?'✓ We\'ll phone you shortly':was;
  if(r&&r.error){alert(r.error);btn.disabled=false;btn.textContent=was;}
}
async function savePdf(){
  const d=window._data; if(!d) return;
  const btn=document.getElementById('pdfBtn'); if(btn){btn.disabled=true;btn.textContent='Preparing…';}
  try{
    const { jsPDF } = await import('https://esm.sh/jspdf@2.5.1');
    const doc=new jsPDF({unit:'pt',format:'a4'}); const M=40, R=555; let y=54;
    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(13,79,74);
    doc.text('Milez Ahead — My statement', M, y); y+=26;
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(60,60,60);
    doc.text(d.profile.full_name||'', M, y); y+=15;
    if(d.profile.phone){ doc.text(d.profile.phone, M, y); y+=15; }
    if(d.credits){ doc.setTextColor(20,20,20); doc.text(`Rides this year: ${d.credits.left} of ${d.credits.total} left (${d.credits.used} used)`, M, y); y+=10; }
    y+=8; doc.setDrawColor(210); doc.line(M, y, R, y); y+=18;
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(20,20,20);
    doc.text('Date', M, y); doc.text('Ref', M+95, y); doc.text('Trip', M+195, y); doc.text('Fare', R, y, {align:'right'}); y+=6;
    doc.line(M, y, R, y); y+=16; doc.setFont('helvetica','normal'); doc.setTextColor(50,50,50);
    (d.trips||[]).forEach(t=>{
      if(y>800){ doc.addPage(); y=54; }
      const from=(t.pickup_address||'').split(',')[0]; const to=(t.dropoff_address||t.airport_code||'').split(',')[0];
      doc.text(String(t.trip_date||''), M, y);
      doc.text(String(t.ref||'').slice(0,16), M+95, y);
      doc.text((from+(to?' → '+to:'')).slice(0,42), M+195, y);
      doc.text(t.fare!=null?('R'+Number(t.fare).toFixed(0)):'', R, y, {align:'right'});
      y+=15;
    });
    if(!(d.trips||[]).length){ doc.text('No trips yet.', M, y); }
    doc.save('Milez-Ahead-statement.pdf');
  }catch(e){ alert('Could not build the PDF — please try again.'); }
  finally{ if(btn){btn.disabled=false;btn.textContent='📄 Download my statement (PDF)';} }
}
async function save(){
  const btn=document.getElementById('save');btn.disabled=true;btn.textContent='Saving…';
  const r=await call({action:'save',
    full_name:document.getElementById('full_name').value,
    email:document.getElementById('email').value,
    alt_contact:document.getElementById('alt_contact').value,
    special_requirements:document.getElementById('special_requirements').value});
  btn.disabled=false;btn.textContent='Save my details';
  const s=document.getElementById('saved');
  if(r.error){alert(r.error);}else{s.style.display='block';setTimeout(()=>s.style.display='none',2500);}
}
function show(html){document.getElementById('main').innerHTML=html;}
load();
</script>
