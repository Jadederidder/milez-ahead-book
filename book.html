<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Milez Ahead — Book a trip</title>
<style>
  :root{ --navy:#1d2a4d; --teal:#0c8b86; --teal2:#13a89c; --gold:#c79a3b; --ink:#1f2430; --muted:#6b7280; --bg:#f4f1ea; --line:#e7e3da; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,var(--navy),#0c5c5a);color:#fff;padding:24px 22px 26px;border-radius:0 0 22px 22px}
  header .kick{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
  header .kick img{height:18px;width:auto;border-radius:3px;background:#fff;padding:1px}
  .mua-badge{display:inline-flex;flex-direction:column;align-items:center;gap:1px;border:1px solid rgba(199,154,59,.55);border-radius:8px;padding:5px 12px;line-height:1}
  .mua-badge b{color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.12em}
  .mua-badge i{color:rgba(199,154,59,.9);font-style:normal;font-size:8px;font-weight:700;letter-spacing:.14em}
  header h1{margin:8px 0 2px;font-size:23px;font-weight:800}
  header p{margin:0;color:#cfe0e2;font-size:14px}
  header .bal{margin-top:12px;display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
  main{padding:16px 16px 30px;flex:1}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.06);padding:16px;margin-bottom:14px}
  label.lab{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin:0 0 7px}
  .field{margin-bottom:14px}
  input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15.5px;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
  textarea{min-height:64px;resize:vertical}
  .svc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .svc button{padding:13px 10px;border:1.5px solid var(--line);border-radius:13px;background:#fff;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;text-align:left}
  .svc button .s{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
  .svc button.sel{border-color:var(--teal);background:#eafaf7;color:var(--navy)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 13px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .chip.sel{border-color:var(--teal);background:#eafaf7;color:var(--navy)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:11px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
  .seg button.sel{border-color:var(--teal);background:#eafaf7;color:var(--navy)}
  .preview{background:#f6fbfa;border:1px solid #cdeae7;border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--navy);font-weight:600;margin-bottom:14px;display:none}
  .escort{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff}
  .escort input{margin-top:3px;width:20px;height:20px;flex-shrink:0}
  .escort .et{font-weight:700;font-size:14.5px;color:var(--navy)}
  .escort .ep{font-weight:700;font-size:11.5px;color:var(--gold);margin-left:6px;letter-spacing:.3px}
  .escort .ed{font-size:12.5px;color:var(--muted);margin-top:4px}
  .indem{display:flex;gap:11px;align-items:flex-start;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
  .indem input{margin-top:3px;width:20px;height:20px;flex-shrink:0}
  .indem span{font-size:13px;color:var(--muted)}
  .cta{width:100%;margin-top:6px;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;font-size:16.5px;font-weight:800;cursor:pointer}
  .cta[disabled]{opacity:.5;cursor:default}
  .err{background:#fde9e3;color:#b4441f;border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;margin:12px 0;display:none}
  .hide{display:none !important}
  .foot{padding:16px;text-align:center;color:#9aa1ab;font-size:11.5px}
  .state{padding:60px 24px;text-align:center}.state .em{font-size:42px}.state h2{margin:14px 0 6px;color:var(--navy)}.state p{color:var(--muted)}
  .spin{display:inline-block;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-4px}@keyframes s{to{transform:rotate(360deg)}}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .rq{color:#dc2626;font-weight:800;margin-left:2px}
  .miss{border-color:#dc2626 !important;background:#fff8f6 !important}
  .acwrap{position:relative}
  .acbox{position:absolute;left:0;right:0;top:100%;z-index:40;background:#fff;border:1.5px solid var(--teal);border-top:none;border-radius:0 0 12px 12px;box-shadow:0 10px 28px rgba(20,30,50,.14);display:none;max-height:230px;overflow:auto}
  .acitem{padding:12px 14px;font-size:14px;cursor:pointer;border-top:1px solid #f1eee6;color:var(--ink)}
  .acitem:active,.acitem:hover{background:#eafaf7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kick"><span>Milez Ahead</span><span id="coBadge" class="mua-badge hide"><b>MUA</b><i>Member benefit</i></span></div>
    <h1 id="hi">Book a trip</h1>
    <p id="sub">Loading…</p>
    <div class="bal hide" id="bal"></div>
  </header>
  <a id="backHome" href="#" style="display:none;margin:12px 16px 0;background:#fff;border:1.5px solid var(--teal, #0c8b86);color:var(--teal, #0c8b86);font-weight:800;font-size:14px;padding:12px;border-radius:14px;text-align:center;text-decoration:none;box-shadow:0 1px 2px rgba(20,30,50,.06)">☰ Menu</a>
  <main id="main"><div class="state"><div class="spin" style="border-color:#cdd6e6;border-top-color:#0c8b86"></div></div></main>
  <div class="foot">Milez Ahead Executive Drive · secure booking</div>
</div>

<script>
// Never let one error white-screen the form in the WhatsApp in-app browser.
window.addEventListener('error', (e)=>{ console.warn('caught', e.message); });
window.addEventListener('unhandledrejection', (e)=>{ console.warn('caught', e.reason); });
const FN = 'https://izslchhcavckowatgbel.supabase.co/functions/v1/book-web';
// Voucher / gift codes are validated by the same context-free check_code action
// index.html uses (the shared voucher engine), so a code reads "valid" identically
// on both forms. The code itself is submitted with the booking below.
const BOOK_TRIP_FN = 'https://izslchhcavckowatgbel.supabase.co/functions/v1/book-trip';
const ANON = 'sb_publishable_ITCnCcqKXF56UearfrSBYg_SXy3QtE8';
const MAPS_KEY = 'AIzaSyAtZvXbiV8BhpC_6dENVYrxoNWdPJlwNiM';
const AIRPORTS =[['CPT','Cape Town Airport (CPT)'],['JNB','O.R. Tambo Airport (JNB)'],['HLA','Lanseria Airport (HLA)'],['DUR','King Shaka Airport (DUR)'],['PLZ','Gqeberha Airport (PLZ)'],['GRJ','George Airport (GRJ)'],['BFN','Bloemfontein Airport (BFN)'],['ELS','East London Airport (ELS)'],['MQP','Kruger Mpumalanga Airport (MQP)'],['PZB','Pietermaritzburg Airport (PZB)'],['KIM','Kimberley Airport (KIM)'],['UTN','Upington Airport (UTN)'],['RCB','Richards Bay Airport (RCB)']];
const SERVICES = [
  ['airport','Airport','transfer to/from'],['drive_home','Home Safe','drive me & my car home'],
  ['convenient','Convenient','everyday driver'],
  ['manage_booking','Private / Card','pay by card'],['trauma','Other','treatment / medical']
];
const qs = new URLSearchParams(location.search); const S = qs.get('s') || '';
// Same hardening as the portal: keep the token in memory, off the address bar.
try{ if(S){const u=new URL(location.href);u.searchParams.delete('s');history.replaceState(null,'',u.pathname+(u.searchParams.toString()?'?'+u.searchParams.toString():'')+u.hash);} }catch(_){}
// Part of the client portal now: give the form a way home.
if(S){const b=document.getElementById('backHome');if(b){b.href='profile.html?s='+encodeURIComponent(S);b.style.display='block';}}
// Book-again prefill (from the portal): pick/drop/svc arrive as params.
window.PREFILL={pick:new URLSearchParams(location.search).get('pick')||'',drop:new URLSearchParams(location.search).get('drop')||'',svc:new URLSearchParams(location.search).get('svc')||''};
const main = document.getElementById('main');
let CTX = {}, place = { pickup:null, drop:null };
const f = {}; // current form values

async function call(payload){ const r = await fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:S,...payload})}); return r.json(); }
function showState(em,t,m){ const s=document.getElementById('sub'); if(s) s.style.display='none'; const b=document.getElementById('bal'); if(b) b.classList.add('hide'); main.innerHTML = `<div class="state"><div class="em">${em}</div><h2>${t}</h2><p>${m}</p></div>`; }
function esc(s){ return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
const haversine=(a,b)=>{const R=6371,d=x=>x*Math.PI/180;const dl=d(b.lat-a.lat),dn=d(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(d(a.lat))*Math.cos(d(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};

function creditsFor(km,radius){ if(km<=radius) return 1; return 1+Math.ceil((Math.min(km,200)-radius)/50); }

function updatePreview(){
  const el=document.getElementById('preview'); if(!el) return;
  if(place.pickup && place.drop){
    const km=haversine(place.pickup,place.drop)*1.4;
    if(CTX.is_member){
      // Credit sanity: base distance credits + 1 per extra stop; then set it
      // against what's actually left. Informational only — never blocks; the
      // paywall is the real authority, and going over just means the extra is
      // charged (MUA SOP), which we say plainly rather than refusing the trip.
      const stops=(window.STOPS||[]).length;
      const c=creditsFor(km,CTX.cover_radius_km||50)+stops;
      const stopNote=stops?` (incl. ${stops} stop${stops===1?'':'s'})`:'';
      const left=CTX.credits_left;
      let txt=`≈ ${Math.round(km)} km · about ${c} credit${c===1?'':'s'}${stopNote}`;
      if(left==null) txt+=' from your allowance';
      else if(c>left) txt+=` — that’s more than your ${left} left this year, so the extra will be charged`;
      else txt+=` of your ${left} left this year`;
      el.textContent=txt; el.style.display='block';
    }
    else { el.textContent=`≈ ${Math.round(km)} km · you'll receive a secure card payment link`; el.style.display='block'; }
  } else el.style.display='none';
}

function render(){
  const isAir = f.service==='airport', isHome = f.service==='drive_home';
  // The "vehicle adequately insured" clause only makes sense for Home Safe, where a
  // Milez chauffeur drives the CLIENT's own car. For every other service Milez
  // supplies the vehicle, so we show a plain terms line without that clause.
  const indemText = isHome
    ? 'I confirm my vehicle is adequately insured, including cover for authorised third-party drivers such as Milez Ahead chauffeurs. I accept that Milez Ahead and its service providers are not liable for any loss, damage or delay arising from the service, except in the case of gross negligence or intentional misconduct.'
    : 'I accept the Milez Ahead / MUA terms &amp; indemnity: the service provider is not liable for belongings or late arrival except in cases of gross negligence.';
  const svcBtns = SERVICES.map(s=>`<button type="button" class="${f.service===s[0]?'sel':''}" onclick="setSvc('${s[0]}')">${s[1]}<span class="s">${s[2]}</span></button>`).join('');
  const airOpts = AIRPORTS.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');
  // Rebook only shows recents of the SELECTED service, so picking one never
  // silently changes the trip type.
  window.RECF=(CTX.recent||[]).filter(t=>t.service_type===f.service);
  const svcLabel=(SERVICES.find(s=>s[0]===f.service)||[])[1]||'';
  const recent = RECF.length ? `<div class="field"><label class="lab">Rebook a recent ${esc(svcLabel)} trip</label><select id="rebook" onchange="rebook(this.value)"><option value="">New trip (tap to see recent trips)</option>${RECF.map((t,i)=>`<option value="${i}">${esc(t.label)}</option>`).join('')}</select></div>`:'';
  main.innerHTML = `
    <div class="card">
      <label class="lab">Service</label><div class="svc">${svcBtns}</div>
    </div>
    ${recent}
    <div class="card">
      <div class="row2"><div class="field"><label class="lab">Date<span class="rq">*</span></label><input type="date" id="date"></div>
      <div class="field"><label class="lab">Pick-up time<span class="rq">*</span></label><div class="row2">
        <select id="thour"><option value="">Hr</option>${Array.from({length:24},(_,i)=>String(i).padStart(2,'0')).map(h=>`<option>${h}</option>`).join('')}</select>
        <select id="tmin"><option value="">Min</option>${['00','15','30','45'].map(m=>`<option>${m}</option>`).join('')}</select>
      </div></div></div>
      <div id="clashWarn" style="display:none;background:#fff7ed;border:1px solid #fdba74;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.45;color:#9a3412"></div>
      <div class="hint" id="timeHint" style="display:none;margin-bottom:10px;border-radius:10px;padding:8px 10px;line-height:1.4;font-size:12.5px"></div>
      <div class="field"><label class="lab" id="pickupLab">${isAir && f.direction==='arrival' ? 'Drop-off address' : 'Pick-up address'}<span class="rq">*</span></label><div class="acwrap"><input type="text" id="pickup" placeholder="Start typing your address…" autocomplete="off"></div>
        <div class="hint" id="pickHint" style="display:none;margin-top:6px;border-radius:10px;padding:8px 10px;line-height:1.4;font-size:12.5px"></div></div>
      <div class="field ${isAir?'hide':''}" id="dropWrap"><label class="lab">Drop-off address<span class="rq">*</span></label><div class="acwrap"><input type="text" id="drop" placeholder="Where to?" autocomplete="off"></div>
        <div class="hint" id="dropHint" style="display:none;margin-top:6px;border-radius:10px;padding:8px 10px;line-height:1.4;font-size:12.5px"></div></div>
      <div class="field" id="stopsWrap"><label class="lab">Extra stops <span style="font-weight:500;text-transform:none;color:#9aa1ab">(optional · 1 credit each)</span></label>
        <div id="stopsList"></div>
        <button type="button" onclick="addStop()" style="border:1px dashed #c9ccd4;background:#fff;color:#6b7280;font-weight:600;font-size:13px;padding:8px 14px;border-radius:10px;width:100%">+ Add a stop</button>
      </div>
      <div class="${isAir?'':'hide'}" id="airWrap">
        <div class="field"><label class="lab">Airport<span class="rq">*</span></label><select id="airport">${airOpts}</select></div>
        <div class="field"><label class="lab">Direction</label><div class="seg"><button type="button" id="dirArr" class="sel" onclick="setDir('arrival')">Arrival</button><button type="button" id="dirDep" onclick="setDir('departure')">Departure</button></div></div>
        <div class="field"><label class="lab">Flight number <span style="font-weight:500;text-transform:none;color:#9aa1ab">(optional)</span></label><input type="text" id="flight" placeholder="e.g. FA204" autocapitalize="characters" style="text-transform:uppercase">
        <div class="hint" id="flightHint" style="display:none;margin-top:6px;border-radius:10px;padding:8px 10px;line-height:1.4"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="row2"><div class="field"><label class="lab">Passengers</label><select id="pax">${Array.from({length:14},(_,i)=>i+1).map(n=>`<option${n===1?' selected':''}>${n}</option>`).join('')}</select></div>
      <div class="field"><label class="lab">Bags<span class="rq">*</span></label><select id="bags"><option value="" selected>How many?</option><option value="0">No bags</option>${Array.from({length:20},(_,i)=>i+1).map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div></div>
      <div class="field"><label class="lab">Luggage size</label><div class="seg"><button type="button" data-sz="small" class="szb sel" onclick="setSz('small')">Small</button><button type="button" data-sz="medium" class="szb" onclick="setSz('medium')">Medium</button><button type="button" data-sz="large" class="szb" onclick="setSz('large')">Large</button></div></div>
      <div class="field"><label class="lab">Travelling with</label><div class="chips" id="special">
        ${['baby_seat:Baby seat','pram:Pram','wheelchair:Wheelchair','golf_bag:Golf bag','bicycle:Bicycle','surfboard:Surfboard'].map(s=>{const[v,l]=s.split(':');return `<div class="chip" data-v="${v}" onclick="tog(this)">${l}</div>`}).join('')}
      </div><div class="hint">Helps us send a vehicle that fits.</div>
      <div class="hint" id="vehHint" style="display:none;color:var(--teal);font-weight:700;margin-top:6px"></div></div>
    </div>
    <div class="card ${isHome?'':'hide'}" id="vehWrap">
      <label class="lab">The car we're driving home<span class="rq">*</span></label>
      <div class="row2"><div class="field"><input type="text" id="vmake" placeholder="Make *" required></div><div class="field"><input type="text" id="vmodel" placeholder="Model *" required></div></div>
      <div class="row2"><div class="field"><input type="text" id="vcolour" placeholder="Colour *" required></div><div class="field"><input type="text" id="vreg" placeholder="Registration (optional)"></div></div>
    </div>
    <div class="card">
      ${isHome?'':`<div class="field"><label class="lab">Preferred driver</label>
        <div class="acwrap">
          <input type="text" id="driverSearch" placeholder="Any available driver — type a name" autocomplete="off">
          <input type="hidden" id="driver" value="${CTX.preferred_driver_id||''}">
          <div class="acbox" id="driverBox"></div>
        </div>
        <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)"><input type="checkbox" id="savePref" style="width:18px;height:18px"> Always use this driver for me</label></div>`}
      ${isHome?'':`<div class="row2">
        <div class="field"><label class="lab">Driver preference</label><select id="driverSex"><option value="">No preference</option><option value="female">Female driver</option><option value="male">Male driver</option></select>
          <div class="hint" id="driverSexHint" style="display:none;margin-top:6px;border-radius:10px;padding:8px 10px;line-height:1.4;background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3"></div></div>
        <div class="field"><label class="lab">Vehicle</label><select id="vehClass"><option value="">No preference</option><option value="sedan">Sedan</option><option value="suv">SUV</option><option value="7seater">7-Seater / group</option><option value="van">Van / large luggage</option></select></div>
      </div>`}
      <div class="field"><label class="lab">Alternative contact number <span style="font-weight:500;text-transform:none;color:#9aa1ab">(optional)</span></label><input type="tel" id="altphone" inputmode="tel" placeholder="e.g. 082 123 4567"></div>
      <div class="field"><label class="lab">Voucher / gift code <span style="font-weight:500;text-transform:none;color:#9aa1ab">(optional)</span></label>
        <input type="text" id="code" placeholder="e.g. MA-XXXXXX" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase">
        <div class="hint" id="codeMsg" style="display:none"></div></div>
      <div class="field"><label class="lab">Notes <span style="font-weight:500;text-transform:none;color:#9aa1ab">(optional)</span></label><textarea id="notes" placeholder="Anything we should know?"></textarea></div>
      ${CTX.escort_enabled?`<div class="field"><label class="lab">Security (optional)</label>
        <label class="escort"><input type="checkbox" id="escort">
          <div><div class="et">🛡️ Add armed escort <span class="ep">FROM R995 / HR</span></div>
          <div class="ed">A discreet armed-response vehicle follows your car door to door, point A to B. The first hour is added upfront; we confirm the final cost with you.</div></div>
        </label></div>`:''}
    </div>
    <div class="preview" id="preview"></div>
    <div class="indem" id="indemWrap"><input type="checkbox" id="indemnity"><span>${indemText}</span></div>
    <div class="err" id="err"></div>
    ${CTX && CTX.is_tester ? `<label id="testWrap" style="display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:13px;color:var(--muted)"><input type="checkbox" id="testFlag" style="width:18px;height:18px"> 🧪 Test booking — won't reach drivers or the live board</label>` : ''}
    <button class="cta" id="go" onclick="submit()">Confirm booking</button>`;
  // wire inputs
  // 5+ passengers can't ride a sedan: pre-select the 7-seater (client can
  // still override) so the wrong-size car never arrives by default.
  document.getElementById('pax').onchange=e=>{ f.pax=e.target.value; applyVehRec(); };
  const _bagsEl=document.getElementById('bags'); if(_bagsEl) _bagsEl.onchange=applyVehRec;
  wireDriverSearch();
  wireCode();
  ['date','time','bags','flight','notes','airport'].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>{};});
  applyVehRec();
  // Live double-booking check — debounced, on any change to date / time / flight.
  const _clash=(()=>{let t;return()=>{clearTimeout(t);t=setTimeout(()=>{checkClash();checkTimeSanity();},400);};})();
  ['date','thour','tmin','flight'].forEach(id=>{const el=document.getElementById(id);if(el){el.addEventListener('change',_clash);el.addEventListener('input',_clash);}});
  // Flight-aware autofill — debounced, on flight-number or date change.
  const _flt=(()=>{let t;return()=>{clearTimeout(t);t=setTimeout(lookupFlight,600);};})();

// Live double-booking warning — as the client sets the date / time / flight, ask

// Flight-aware autofill — when the client types a flight number (+ date), ask

// flight, then fill the airport and, for an arrival, the pick-up time from the
// actual landing (floored to the quarter-hour). Best-effort: a miss just clears
// the hint and the client fills the fields by hand.
window._flightSeen='';
window.lookupFlight=async()=>{
  const hint=document.getElementById('flightHint'); if(!hint) return;
  if(f.service!=='airport'){ hint.style.display='none'; return; }
  const ident=(document.getElementById('flight')?.value||'').replace(/[^0-9a-z]/gi,'').toUpperCase();
  const date=document.getElementById('date')?.value;
  const direction=f.direction||'arrival';
  if(ident.length<3||!date){ hint.style.display='none'; return; }
  const seen=`${ident}|${date}|${direction}`;

  window._flightSeen=seen;
  try{
    const r=await call({action:'lookup_flight', flight_number:ident, trip_date:date, direction});
    const fl=r&&r.flight;
    if(!fl||!fl.iata){ hint.style.display='none'; window._flightInfo=null; if(window.checkTimeSanity)checkTimeSanity(); return; }
    window._flightInfo={direction:fl.direction,date:fl.date,time:fl.time,cancelled:fl.cancelled}; // for the departure-timing check
    const air=document.getElementById('airport');
    const known=air&&[...air.options].some(o=>o.value===fl.iata);
    if(known) air.value=fl.iata; // the flight is ground truth for the airport
    const airLabel=known?air.options[air.selectedIndex].text:(fl.airport_name?`${fl.airport_name} (${fl.iata})`:fl.iata);
    const dstr=fl.date?new Date(fl.date+'T00:00:00+02:00').toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'}):'';
    let msg='',warn=false;
    if(fl.cancelled){ warn=true; msg=`⚠️ Flight <b>${fl.ident}</b> is showing as <b>cancelled</b> — please double-check before booking.`; }
    else if(direction==='arrival'){

      // already chose (their plan wins; we just help when the box is blank).

        if(th&&!th.value){

          filledTime=true;
        }
      }
      msg=`✈️ Recognised <b>${fl.ident}</b> — lands <b>${airLabel}</b>${fl.time?` at <b>${fl.time}</b>`:''}${dstr?`, ${dstr}`:''}. We’ve set your airport${filledTime?` and pick-up time`:''} for you${filledTime?'':' — set a pick-up time that suits you'}.`;
    } else {
      msg=`✈️ <b>${fl.ident}</b> departs <b>${airLabel}</b>${fl.time?` at <b>${fl.time}</b>`:''}${dstr?`, ${dstr}`:''}. Airport set — choose a pick-up time that gets you there in good time.`;
    }
    hint.innerHTML=msg;
    hint.style.background=warn?'#fff7ed':'#ecfdf5';
    hint.style.border=warn?'1px solid #fdba74':'1px solid #6ee7b7';
    hint.style.color=warn?'#9a3412':'#065f46';
    hint.style.display='block';
    checkClash();

  }catch(_){ hint.style.display='none'; }
};

// Modern, lightweight address autocomplete via the Places API (New) over fetch
// + a custom dropdown — no heavy Maps SDK, no deprecated component (which crashed
// the WhatsApp browser). Everything is guarded so a failure only means "no
// suggestions", never a crash; the typed address still submits and we geocode it.
function initMaps(){
  attachAC(document.getElementById('pickup'), 'pickup');
  attachAC(document.getElementById('drop'), 'drop');
}
function attachAC(input, which){
  if(!input || input._ac) return; input._ac=1;
  const box=document.createElement('div'); box.className='acbox'; input.parentNode.appendChild(box);
  let timer;
  input.addEventListener('input', ()=>{
    place[which]=null;
    if(window._addrBlurred) _addrBlurred[which]=false; // editing again — hold the pin nudge until they leave
    if(window.addressConfidence) addressConfidence();  // keep same-address check live
    const q=input.value.trim(); clearTimeout(timer);
    if(q.length<3){ box.style.display='none'; return; }
    timer=setTimeout(()=>suggest(q, box, input, which), 250);
  });
  input.addEventListener('blur', ()=>setTimeout(()=>{ box.style.display='none'; if(window._addrBlurred){ _addrBlurred[which]=true; addressConfidence(); } }, 200));
}
async function suggest(q, box, input, which){
  try{
    const r=await fetch('https://places.googleapis.com/v1/places:autocomplete',{
      method:'POST', headers:{'Content-Type':'application/json','X-Goog-Api-Key':MAPS_KEY},
      body:JSON.stringify({input:q, includedRegionCodes:['za']})
    });
    if(!r.ok){ box.style.display='none'; return; }
    const d=await r.json();
    const items=(d.suggestions||[]).map(s=>s.placePrediction).filter(Boolean).slice(0,5);
    if(!items.length){ box.style.display='none'; return; }
    box.innerHTML=items.map(s=>`<div class="acitem" data-id="${s.placeId}">${esc(s.text&&s.text.text||'')}</div>`).join('');
    box.style.display='block';
    box.querySelectorAll('.acitem').forEach((it,i)=>{ it.onpointerdown=(e)=>{ e.preventDefault(); pick(items[i], input, which, box); }; });
  }catch(_){ box.style.display='none'; }
}
// Searchable preferred-driver picker — typeahead over CTX.drivers, so it scales
// past a scroll-through list (1000+ drivers). Selection sets the hidden #driver id.
function wireDriverSearch(){
  const inp=document.getElementById('driverSearch'), hid=document.getElementById('driver'), box=document.getElementById('driverBox');
  if(!inp||!hid||!box) return;
  if(hid.value){ const d=(CTX.drivers||[]).find(x=>x.id===hid.value); if(d) inp.value=d.name; }
  function render(q){
    const ql=(q||'').trim().toLowerCase();
    const list=(CTX.drivers||[]).filter(d=>!ql||(d.name||'').toLowerCase().includes(ql)).slice(0,8);
    const rows=['<div class="acitem" data-id="">Any available driver</div>']
      .concat(list.map(d=>`<div class="acitem" data-id="${d.id}">${esc(d.name)}</div>`));
    box.innerHTML=rows.join('');
    box.querySelectorAll('.acitem').forEach(it=>{ it.onpointerdown=e=>{ e.preventDefault(); hid.value=it.dataset.id; inp.value=it.dataset.id?it.textContent:''; box.style.display='none'; }; });
    box.style.display='block';
  }
  inp.oninput=()=>{ hid.value=''; render(inp.value); };
  inp.onfocus=()=>render(inp.value);
  inp.onblur=()=>setTimeout(()=>{ box.style.display='none'; },150);

async function pick(s, input, which, box){
  // A stop's model (window.STOPS) is the source of truth renderStops() rebuilds
  // from. pick() sets input.value/dataset.full directly with no input event, so
  // grab the stop's object NOW — before the await, since delStop() can shift the
  // positional index underneath us — and sync the chosen address onto that same
  // object at the end. Without this, the moment the client adds or removes another
  // stop, renderStops() reverts this field to the raw typed text (the 24 Aug
  // DOM-collection fix covered submit, not re-render).
  const stopObj = /^stop\d+$/.test(which) ? window.STOPS[+which.slice(4)] : null;
  input.value=(s.text&&s.text.text)||input.value; box.style.display='none';
  try{
    const r=await fetch(`https://places.googleapis.com/v1/places/${s.placeId}?fields=location,formattedAddress`,{headers:{'X-Goog-Api-Key':MAPS_KEY}});
    const pd=await r.json();
    if(pd.location){ place[which]={lat:pd.location.latitude,lng:pd.location.longitude}; }
    if(pd.formattedAddress){
      // Show the FULL address the client picked so they can see it's correct — only
      // trim the redundant ", South Africa" (and any trailing postcode) tail so the
      // box reads cleanly. The complete address is also kept for the driver/back-office.
      input.dataset.full=pd.formattedAddress;

// Address confidence — two soft, never-blocking nudges (JD: assist, don't
// obstruct). (1) If a client typed an address but didn't tap a suggestion (so we
// have no exact pin), we gently suggest picking one after they leave the field —
// this is what stops a driver going to the wrong place. We still geocode a typed
// address on submit, so it never blocks. (2) If pick-up and drop-off read the
// same, we ask if they meant two different places. Both are hints, not gates.
function setAddrHint(hint,msg,warn){ if(!hint) return; if(!msg){ hint.style.display='none'; hint.innerHTML=''; return; } hint.innerHTML=msg; hint.style.background=warn?'#fff7ed':'#f0f9ff'; hint.style.border='1px solid '+(warn?'#fdba74':'#bae6fd'); hint.style.color=warn?'#9a3412':'#075985'; hint.style.display='block'; }
window._addrBlurred={pickup:false,drop:false};
window.addressConfidence=()=>{
  const isAir=f.service==='airport';
  const pk=document.getElementById('pickup'), dr=document.getElementById('drop');
  const pkHint=document.getElementById('pickHint'), drHint=document.getElementById('dropHint');
  const txt=el=>((el&&(el.dataset.full||el.value))||'').trim();
  const pinned=w=>!!(place&&place[w]&&place[w].lat);
  const norm=s=>((s||'').toLowerCase().replace(/,?\s*south africa\s*$/i,'').replace(/[^a-z0-9]/g,''));
  // (1a) pick-up pin nudge — only after the field has been left (never mid-type)
  const pkPin=_addrBlurred.pickup && txt(pk).length>=6 && !pinned('pickup');
  setAddrHint(pkHint, pkPin?'📍 Tip: tap a suggestion so your driver has an exact pin — we’ll still find you if you type it in.':'', false);
  if(isAir){ setAddrHint(drHint,'',false); return; } // airport uses the dropdown, no free drop-off
  // (2) same pick-up & drop-off — live, takes priority on the drop-off hint
  const a=norm(txt(pk)), b=norm(txt(dr));
  if(a&&b&&a===b){ setAddrHint(drHint,'⚠️ Your pick-up and drop-off look the same — did you mean two different places?',true); return; }
  // (1b) drop-off pin nudge
  const drPin=_addrBlurred.drop && txt(dr).length>=6 && !pinned('drop');
  setAddrHint(drHint, drPin?'📍 Tip: tap a suggestion so your driver has an exact pin.':'', false);
};
// Time sanity — soft, never blocks (JD: assist, don't obstruct). Warns on a
// pick-up time that's already passed, and — for an airport departure whose flight
// we recognised — a pick-up that's at/after the flight or cutting it fine. A
// very-soon booking gets a gentle "we'll do our best" note, not a block.
window.checkTimeSanity=()=>{
  const hint=document.getElementById('timeHint'); if(!hint) return;
  const date=document.getElementById('date')?.value;
  const h=document.getElementById('thour')?.value, m=document.getElementById('tmin')?.value;
  if(!date||!h){ setAddrHint(hint,'',false); return; }
  const when=new Date(`${date}T${h}:${(m||'00')}:00+02:00`);
  if(isNaN(+when)){ setAddrHint(hint,'',false); return; }
  const mins=(+when - Date.now())/60000;
  if(mins<0){ setAddrHint(hint,'⏰ That pick-up time has already passed — please choose a later time.',true); return; }
  const fi=window._flightInfo;
  if(f.service==='airport' && fi && fi.direction==='departure' && fi.time && fi.date===date){
    const [dh,dm]=fi.time.split(':').map(Number);
    const dep=new Date(`${date}T${String(dh).padStart(2,'0')}:${String(dm).padStart(2,'0')}:00+02:00`);
    const lead=(+dep - +when)/60000;
    if(lead<=0){ setAddrHint(hint,`⏰ Your pick-up is at or after your ${fi.time} flight departs — you’ll want an earlier pick-up.`,true); return; }
    if(lead<90){ setAddrHint(hint,`⏰ Only ${Math.round(lead)} min before your ${fi.time} flight — consider an earlier pick-up to be safe.`,true); return; }
  }
  if(mins<120){ setAddrHint(hint,'⏰ That’s soon — we’ll do our best to have a driver ready in time.',false); return; }
  setAddrHint(hint,'',false);
};

// Red-border every compulsory field that's still empty (JD, 26 Aug): the
// bottom message names ONE gap; the borders show ALL of them at a glance,
// and each clears itself the moment the client fills the field.
function markMiss(el){ if(!el) return; el.classList.add('miss'); const clr=()=>el.classList.remove('miss'); el.addEventListener('input',clr,{once:true}); el.addEventListener('change',clr,{once:true}); }
function requiredGaps(){
  const g=[]; const by=(id)=>document.getElementById(id);
  if(!by('date').value) g.push(by('date'));
  if(!by('thour').value) g.push(by('thour'));
  if(!by('tmin').value) g.push(by('tmin'));
  const pk=by('pickup'); if(!(pk.dataset.full||pk.value.trim())) g.push(pk);
  if(f.service==='airport'){ if(!by('airport').value) g.push(by('airport')); }
  else { const d=by('drop'); if(d&&!(d.dataset.full||d.value.trim())) g.push(d); }
  if(by('bags').value==='') g.push(by('bags'));
  if(f.service==='drive_home'){ for(const id of ['vmake','vmodel','vcolour']){ const el=by(id); if(el&&!(el.value||'').trim()) g.push(el); } }

window.submit=async()=>{
  const err=document.getElementById('err'); err.style.display='none';
  const go=document.getElementById('go');
  const gaps=requiredGaps();
  if(gaps.length){ gaps.forEach(markMiss); gaps[0].scrollIntoView({behavior:'smooth',block:'center'}); }
  // When MORE THAN ONE required field is empty, name them all — not just the
  // first (JD: minutes AND bags were blank but the alert only mentioned the
  // time). A single gap still gets its specific, friendlier message below.
  if(gaps.length>1){
    const NAME={date:'date',thour:'pick-up hour',tmin:'pick-up minutes',pickup:(f.service==='airport'&&(f.direction||'arrival')==='arrival')?'drop-off address':'pick-up address',drop:'drop-off address',airport:'airport',bags:'number of bags',vmake:'car make',vmodel:'car model',vcolour:'car colour'};
    const uniq=[...new Set(gaps.map(el=>NAME[el.id]||'a required field'))];
    const list=uniq.length>1 ? uniq.slice(0,-1).join(', ')+' and '+uniq[uniq.length-1] : uniq[0];
    err.textContent='Please fill in the highlighted fields: '+list+'.'; err.style.display='block'; return;
  }
  if(!f.service){ err.textContent='Please choose a service.'; err.style.display='block'; return; }
  if(!document.getElementById('date').value){ err.textContent='Please choose a date.'; err.style.display='block'; return; }
  const isAir=f.service==='airport';
  const pickupEl=document.getElementById('pickup');
  const pickup=(pickupEl.dataset.full||pickupEl.value.trim());
  if(!pickup){ err.textContent=(isAir && (f.direction||'arrival')==='arrival') ? 'Please enter the drop-off (destination) address.' : 'Please enter a pick-up address.'; err.style.display='block'; return; }
  if(!document.getElementById('thour').value){ err.textContent='Please choose a pick-up time.'; err.style.display='block'; return; }
  // Minutes are an EXPLICIT choice — the silent :00 default booked a trip at the
  // wrong time in JD's 25 Aug drill (same failure shape as the bags default).
  if(!document.getElementById('tmin').value){ err.textContent='Please choose the pick-up minutes too — pick :00 if it\'s on the hour.'; err.style.display='block'; return; }
  // A pick-up in the past can only be a typo. (Short-notice is fine — the
  // dispatch engine has a real-time lane — so we only block actual history.)
  const _when=new Date(document.getElementById('date').value+'T'+document.getElementById('thour').value+':'+(document.getElementById('tmin').value||'00')+':00+02:00');
  if(!isNaN(_when.getTime())&&_when.getTime()<Date.now()){ err.textContent='That pick-up time has already passed — please check the date and time.'; err.style.display='block'; return; }
  // Bags are an EXPLICIT choice — the silent 0 default let a "medium" pick
  // sail through with no count (JD, 24 Aug, twice). "No bags" is one tap.
  const _bagsRaw=document.getElementById('bags').value;
  if(_bagsRaw===''){ err.textContent='How many bags are you bringing? Pick a number — "No bags" counts too.'; err.style.display='block'; return; }
  const _bags=+_bagsRaw||0;
  if((f.size==='medium'||f.size==='large')&&_bags===0){ err.textContent='You chose '+f.size+' luggage — how many bags are coming? Set Bags to 1 or more (or switch the size to Small if you’re travelling light).'; err.style.display='block'; return; }
  if(isAir){
    if(!document.getElementById('airport').value){ err.textContent='Please choose the airport.'; err.style.display='block'; return; }
  } else {
    const dEl=document.getElementById('drop'); const drop=(dEl&&(dEl.dataset.full||dEl.value.trim()))||'';
    if(!drop){ err.textContent='Please enter a drop-off address.'; err.style.display='block'; return; }
    if(pickup.trim().toLowerCase()===drop.trim().toLowerCase()){ err.textContent='Your pick-up and drop-off are the same address — please change one.'; err.style.display='block'; return; }
  }
  // Home Safe: the team drives the CLIENT'S car home — make, model AND colour
  // are compulsory on every channel (JD, 25 Aug — driver request; the offer
  // push names the car). Registration stays optional: typo-prone, and the team
  // identifies the car by colour + model at the door.
  if(f.service==='drive_home'){
    const _mk=(document.getElementById('vmake').value||'').trim(), _md=(document.getElementById('vmodel').value||'').trim(), _cl=(document.getElementById('vcolour').value||'').trim();
    if(!_mk||!_md||!_cl){ err.textContent='Which car are we driving home? Please give the make, model and colour so your driver team can find it.'; err.style.display='block'; return; }
  }
  // Alternative number: only checked when given, and only for obvious typos.
  const _alt=(document.getElementById('altphone').value||'').trim();
  if(_alt){ const _d=_alt.replace(/\D/g,''); if(!/^(0\d{9}|27\d{9})$/.test(_d)){ err.textContent='That alternative contact number doesn’t look right — e.g. 082 123 4567.'; err.style.display='block'; return; } }
  if(!document.getElementById('indemnity').checked){ err.textContent='Please accept the terms & indemnity to continue.'; document.getElementById('indemWrap').style.borderColor='#dc2626'; err.style.display='block'; return; }
  const special=[...document.querySelectorAll('#special .chip.sel')].map(c=>c.dataset.v);
  const booking={
    service_type:f.service, trip_date:document.getElementById('date').value, pickup_time:(document.getElementById('thour').value?`${document.getElementById('thour').value}:${document.getElementById('tmin').value||'00'}`:undefined),
    passengers:+document.getElementById('pax').value||1, luggage:+document.getElementById('bags').value||0, luggage_size:f.size||'small',
    pickup_address:pickup, pickup_lat:place.pickup?.lat??null, pickup_lng:place.pickup?.lng??null,
    special_items:special, notes:[((document.getElementById('altphone').value||'').trim()?('Alt contact: '+document.getElementById('altphone').value.trim()):''),(document.getElementById('notes').value||'').trim()].filter(Boolean).join(' · ')||undefined,
    // Home Safe has no preferred-driver field (Marcelle, 25 Aug) — a requested
    // driver would bypass the 2-driver team broadcast, so it stays null there.
    requested_driver_id:document.getElementById('driver')?.value||null,
    // Home Safe renders neither select: the team pairs are fixed and the
    // vehicle is the client's own car (JD, 25 Aug).
    driver_sex_pref:document.getElementById('driverSex')?.value||null,
    vehicle_class_pref:document.getElementById('vehClass')?.value||null,
    indemnity_accepted:true,
    add_escort:!!document.getElementById('escort')?.checked, policy_number:CTX.policy_number||undefined,
    code:((document.getElementById('code')||{}).value||'').trim().toUpperCase()||undefined,
  };
  if(isAir){
    booking.airport_code=document.getElementById('airport').value; booking.direction=f.direction||'arrival'; booking.flight_number=document.getElementById('flight').value||undefined;
    // Mirror the console: one leg is the airport (from the dropdown), the other is
    // the client's own address (the box above). For an ARRIVAL the airport is the
    // pickup and the box is the destination — so it MUST be captured as the drop-off,
    // otherwise the trip has no destination and a later rebook has nothing to pre-fill.
    const airSel=document.getElementById('airport'); const airLabel=(airSel.options[airSel.selectedIndex]&&airSel.options[airSel.selectedIndex].text)||booking.airport_code;
    if(booking.direction==='arrival'){
      booking.dropoff_address=pickup; booking.dropoff_lat=place.pickup?.lat??null; booking.dropoff_lng=place.pickup?.lng??null;
      booking.pickup_address=airLabel; booking.pickup_lat=null; booking.pickup_lng=null;
    } else {
      booking.dropoff_address=airLabel; booking.dropoff_lat=null; booking.dropoff_lng=null;
    }
  }
  else { const dropEl=document.getElementById('drop'); booking.dropoff_address=(dropEl.dataset.full||dropEl.value.trim())||undefined; booking.dropoff_lat=place.drop?.lat??null; booking.dropoff_lng=place.drop?.lng??null; }
  if(f.service==='drive_home'){ booking.client_vehicle_make=document.getElementById('vmake').value||null; booking.client_vehicle_model=document.getElementById('vmodel').value||null; booking.client_vehicle_colour=document.getElementById('vcolour').value||null; booking.client_vehicle_reg=document.getElementById('vreg').value||null; }
  go.disabled=true; go.innerHTML='<span class="spin"></span>';
  try{
    // Stops come from the DOM, not just typed state: an autocomplete pick sets
    // input.value/dataset.full programmatically (no input event), so state-only
    // collection would miss it.
    booking.stops=[...document.querySelectorAll('input[data-stop]')].map(inp=>({
      kind:(window.STOPS[+inp.dataset.stop]||{}).kind||'dropoff',
      address:(inp.dataset.full||inp.value||'').trim(),
    })).filter(st=>st.address);
    booking.test=!!document.getElementById('testFlag')?.checked; // only tester tokens can flip a booking to test (enforced server-side)
    const res=await call({action:'submit',booking,save_preferred:document.getElementById('savePref')?.checked});
    if(res.ok){ showState('✅','Booking received','Trip '+res.ref+' is in — taking you back to WhatsApp…'); setTimeout(()=>{location.href='https://wa.me/27799722798';},2000); return; }
    throw new Error(res.error||'Something went wrong.');
  }catch(e){
    go.disabled=false; go.textContent='Confirm booking';
    // A network drop mid-submit can mean the booking LANDED but the reply was
    // lost ("Failed to fetch", 24 Aug — the trip existed, the client saw an
    // error). Be honest and anti-duplicate: point them at WhatsApp first.
    const _net=/failed to fetch|networkerror|load failed/i.test(String(e&&e.message||''));
    err.textContent=_net
      ? 'Connection hiccup — your booking may still have gone through. Check WhatsApp: if your confirmation arrives within a minute, you’re done. No message? Tap Confirm booking again.'
      : e.message;
    err.style.display='block';
  }
};

(async function init(){
  if(!S){ showState('🔗','Link not valid','Please use the booking link from your Milez Ahead WhatsApp.'); return; }
  try{
    const c=await call({action:'context'});
    if(c.error){ showState('🔗','Link not valid',c.error); return; }
    CTX=c; f.service='airport'; f.size='small'; f.direction='arrival';
    document.getElementById('hi').textContent=c.name?`Hi ${esc(c.name.split(' ')[0])} 👋`:'Book a trip';
    document.getElementById('sub').textContent='Tell us about your trip — a few taps.';
    if(c.is_member && c.credits_left!=null){ const b=document.getElementById('bal'); b.textContent=`🎟️ ${c.credits_left} trips left`; b.classList.remove('hide'); }
    if(c.mua){ document.getElementById('coBadge').classList.remove('hide'); }
    render();
  }catch(e){ showState('⚠️','Could not load','Please try the link again in a moment.'); }
})();
</script>
</body>
</html>
